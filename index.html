<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今天要吃什麼勒</title>
  <style>
    :root {
      --bg-color: #f4f7f7;
      --primary: #1f4e5f;
      --primary-dark: #163a47;
      --secondary: #79a8a9;
      --accent: #aacfd0;
      --accent-light: rgba(170, 207, 208, 0.25);
      --white: #ffffff;
      --text: #2c3e50;
      --danger: #e74c3c;
      --danger-bg: #fdeeee;
      --success: #27ae60;
      --success-bg: #e8f8f0;
      --border: #d2e4e4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); padding-bottom: 60px; }
    header { background-color: var(--primary); color: var(--white); padding: 16px 20px; text-align: center; position: relative; box-shadow: 0 2px 8px rgba(31, 78, 95, 0.2); }
    header h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 4px; }
    .shop-badge { display: inline-block; background-color: var(--secondary); color: var(--white); padding: 4px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 500; }
    .admin-entry-btn { position: absolute; top: 14px; right: 14px; background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3); color: #fff; padding: 5px 9px; border-radius: 20px; font-size: 0.75rem; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: all 0.2s; }
    .admin-entry-btn:hover { background: rgba(255, 255, 255, 0.28); }
    .tabs { display: flex; justify-content: center; background-color: var(--white); border-bottom: 2px solid var(--accent); position: sticky; top: 0; z-index: 10; }
    .tab-btn { flex: 1; max-width: 220px; padding: 13px 10px; border: none; background: none; font-size: 0.95rem; font-weight: 600; color: var(--secondary); cursor: pointer; transition: all 0.2s; border-bottom: 3px solid transparent; }
    .tab-btn.active { color: var(--primary); border-bottom: 3px solid var(--primary); background-color: rgba(170, 207, 208, 0.15); }
    .container { max-width: 680px; margin: 20px auto; padding: 0 16px; }
    .card { background-color: var(--white); border-radius: 12px; padding: 22px; box-shadow: 0 4px 14px rgba(0,0,0,0.04); border: 1px solid var(--accent); margin-bottom: 20px; }
    .card-title { font-size: 1.15rem; color: var(--primary); font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--primary); margin-bottom: 6px; }
    input[type="text"], input[type="password"], select { width: 100%; padding: 10px 12px; border: 1.5px solid var(--accent); border-radius: 8px; font-size: 0.95rem; outline: none; transition: 0.2s; background-color: #fff; }
    select:disabled { background-color: #eef4f4; cursor: not-allowed; }
    input:focus, select:focus { border-color: var(--secondary); box-shadow: 0 0 0 3px rgba(121, 168, 169, 0.2); }
    .item-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
    .item-row select { flex: 2; }
    .item-row .price-tag { width: 75px; text-align: right; font-weight: 700; color: var(--primary); font-size: 0.95rem; }
    .btn-remove { background: none; border: none; color: var(--danger); font-size: 1.2rem; cursor: pointer; padding: 0 6px; transition: transform 0.2s; }
    .btn-remove:hover { transform: scale(1.1); }
    .btn-add-item { background-color: rgba(170, 207, 208, 0.25); border: 1.5px dashed var(--secondary); color: var(--primary); padding: 10px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: 600; margin-top: 6px; transition: 0.2s; }
    .btn-add-item:hover { background-color: var(--accent); }
    .summary-box { background-color: rgba(170, 207, 208, 0.2); border-left: 4px solid var(--primary); padding: 12px 16px; border-radius: 6px; margin: 18px 0; display: flex; justify-content: space-between; align-items: center; }
    .total-price { font-size: 1.3rem; font-weight: 800; color: var(--primary); }
    .btn-submit { background-color: var(--primary); color: var(--white); border: none; padding: 13px; width: 100%; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .btn-submit:hover:not(:disabled) { background-color: var(--primary-dark); }
    .btn-submit:disabled { background-color: #94a3a8; cursor: not-allowed; }
    .btn-action { background-color: var(--primary); color: #fff; border: none; padding: 8px 14px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-action:hover { background-color: var(--primary-dark); }
    .btn-danger { background-color: var(--danger); color: white; border: none; padding: 10px 14px; border-radius: 6px; font-size: 0.9rem; font-weight: 600; cursor: pointer; width: 100%; transition: 0.2s; }
    .btn-danger:hover { background-color: #c0392b; }
    .btn-back { background: #718096; color: white; border: none; padding: 11px; border-radius: 8px; width: 100%; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-top: 15px; transition: 0.2s; }
    .btn-back:hover { background: #4a5568; }
    .search-box { margin-bottom: 15px; width: 100%; padding: 10px 12px; border: 1.5px solid var(--accent); border-radius: 8px; font-size: 0.95rem; outline: none; }
    .order-item { border: 1px solid var(--accent); border-radius: 8px; padding: 14px; margin-bottom: 12px; background: #fafdfd; transition: box-shadow 0.2s; }
    .order-item:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .order-user { font-weight: 700; color: var(--primary); font-size: 1rem; }
    .badge { padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; border: none; cursor: pointer; transition: all 0.15s ease-in-out; }
    .badge-paid, .badge.paid { background-color: var(--success-bg); color: var(--success); border: 1px solid #b7ebd0; }
    .badge-unpaid { background-color: var(--danger-bg); color: var(--danger); border: 1px solid #fad2d2; }
    .badge:disabled { opacity: 0.6; cursor: not-allowed; }
    .admin-badge { background-color: #e67e22; color: #fff; font-size: 0.75rem; padding: 3px 8px; border-radius: 10px; margin-left: 6px; }
    .admin-stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
    .stat-card { background: #f8fbfb; border: 1px solid var(--accent); border-radius: 8px; padding: 10px 14px; text-align: center; }
    .stat-card .stat-num { font-size: 1.25rem; font-weight: 800; color: var(--primary); margin-top: 4px; }
    .stat-card .stat-label { font-size: 0.75rem; color: #666; }
    .admin-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .admin-table th, .admin-table td { border: 1px solid #e1ecec; padding: 8px 6px; text-align: left; }
    .admin-table th { background-color: #edf5f5; color: var(--primary); font-weight: 700; }
    .loader { text-align: center; padding: 30px; color: var(--secondary); font-size: 0.95rem; }
    .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(121, 168, 169, 0.3); border-radius: 50%; border-top-color: var(--primary); animation: spin 1s ease-in-out infinite; vertical-align: middle; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .retry-box { text-align:center; color:#888; padding:20px; }
    .retry-box .retry-btn { margin-top: 12px; }
    .conn-banner { display:none; background:#fdeeee; color:#c0392b; font-size:0.8rem; text-align:center; padding:6px 10px; border-bottom:1px solid #fad2d2; }
    .conn-banner.show { display:block; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(31, 78, 95, 0.45); display: none; justify-content: center; align-items: center; z-index: 2000; }
    .modal-card { background: #ffffff; border-radius: 14px; padding: 24px; max-width: 320px; width: 85%; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.15); border: 1.5px solid var(--accent); animation: popIn 0.25s ease-out; }
    @keyframes popIn { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .modal-icon { font-size: 2.2rem; margin-bottom: 10px; }
    .modal-title { font-size: 1.15rem; font-weight: 700; color: var(--primary); margin-bottom: 8px; }
    .modal-msg { font-size: 0.95rem; color: #444; margin-bottom: 18px; line-height: 1.5; white-space: pre-line; }
    .modal-btn-group { display: flex; gap: 10px; justify-content: center; }
    .modal-btn { background: var(--primary); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: 0.2s; flex: 1; }
    .modal-btn:hover { background: var(--primary-dark); }
    .modal-btn-cancel { background: #95a5a6; }
    .modal-btn-cancel:hover { background: #7f8c8d; }
  </style>
</head>
<body>

  <div class="conn-banner" id="connBanner">⚠️ 目前資料可能不是最新，正在嘗試重新連線...</div>

  <header>
    <h1>🍱 今天要吃什麼勒</h1>
    <div class="shop-badge" id="currentShopText"><span class="spinner" style="width:14px;height:14px;border-width:2px;margin-right:4px;"></span>載入中...</div>
    <button class="admin-entry-btn" onclick="openAdminModal()" title="後台管理">
      <span>🔒</span> 管理員
    </button>
  </header>

  <div class="tabs" id="mainTabs">
    <button class="tab-btn active" onclick="switchTab('order')">我要點餐</button>
    <button class="tab-btn" onclick="switchTab('status')">對帳與查詢</button>
    <button class="tab-btn" onclick="switchTab('menu')">今日菜單</button>
  </div>

  <div class="container">
    <div id="tab-order">
      <div class="card">
        <div class="card-title">填寫訂購資訊</div>

        <div class="form-group">
          <label for="groupSelect">組別 *</label>
          <select id="groupSelect" onchange="updateNameOptions()">
            <option value="">-- 請選擇組別 --</option>
            <option value="第一組">第一組</option>
            <option value="第二組">第二組</option>
            <option value="第三組">第三組</option>
            <option value="第四組">第四組</option>
            <option value="第五組">第五組</option>
            <option value="教師組">教師組</option>
          </select>
        </div>

        <div class="form-group">
          <label for="nameSelect">座號與姓名 *</label>
          <select id="nameSelect" disabled>
            <option value="">-- 請先選擇組別 --</option>
          </select>
        </div>

        <div class="form-group">
          <label>餐點品項 (最多 5 項)</label>
          <div id="itemList"></div>
          <button type="button" class="btn-add-item" id="btnAddItem" onclick="addItemRow()">+ 新增一項餐點</button>
        </div>

        <div class="form-group">
          <label>備註</label>
          <input type="text" id="orderNote" placeholder="（不一定要填）">
        </div>

        <div class="summary-box">
          <span>應付總金額</span>
          <span class="total-price" id="totalDisplay">$0</span>
        </div>

        <button class="btn-submit" id="submitBtn" onclick="handleOrderSubmit()">確認送出點餐</button>
      </div>
    </div>

    <div id="tab-status" style="display:none;">
      <div class="card">
        <div class="card-title">
          <span>點餐與繳費狀態</span>
          <button class="btn-action" id="btnRefreshStatus" style="padding: 4px 10px; font-size: 0.8rem;" onclick="loadStatusData(true)">🔄 重新整理</button>
        </div>
        <div style="margin-bottom: 15px;">
          <input type="text" id="statusFilter" class="search-box" placeholder="輸入姓名或組別搜尋..." oninput="filterStatus()">
        </div>
        <div id="statusList" class="loader">
          <span class="spinner"></span> 載入紀錄中...
        </div>
      </div>
    </div>

    <div id="tab-menu" style="display:none;">
      <div class="card">
        <div class="card-title">今日菜單總覽</div>
        <div id="menuList" class="loader">
          <span class="spinner"></span> 載入菜單中...
        </div>
      </div>
    </div>

    <div id="tab-admin" style="display:none;">
      <div class="card">
        <div class="card-title">
          <div>⚙️ 管理員控制台 <span class="admin-badge">已登入</span></div>
        </div>

        <div class="admin-stats-grid">
          <div class="stat-card">
            <div class="stat-label">今日總訂單數</div>
            <div class="stat-num" id="statOrderCount">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">訂單總金額</div>
            <div class="stat-num" id="statTotalAmount">$0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">已收金額 (已繳)</div>
            <div class="stat-num" style="color:var(--success);" id="statPaidAmount">$0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">未收金額 (未繳)</div>
            <div class="stat-num" style="color:var(--danger);" id="statUnpaidAmount">$0</div>
          </div>
        </div>

        <div style="background:#fafdfd; border:1px solid var(--accent); border-radius:8px; padding:14px; margin-bottom:15px;">
          <label>🔄 切換今日店家</label>
          <div style="display: flex; gap: 8px; margin-top: 6px;">
            <select id="adminShopsSelect"></select>
            <button class="btn-action" style="white-space: nowrap;" onclick="handleAdminChangeShop()">確認更換</button>
          </div>
        </div>

        <div style="background:#fafdfd; border:1px solid var(--accent); border-radius:8px; padding:14px; margin-bottom:15px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <label style="margin:0;">📋 點餐人員對帳管理 <span style="font-size:0.75rem; color:#888; font-weight:normal;">(點擊狀態按鈕可即時切換)</span></label>
            <button class="btn-action" id="btnRefreshAdmin" style="padding: 3px 8px; font-size:0.75rem;" onclick="loadAdminOrders(true)">🔄 重新整理</button>
          </div>
          <div id="adminOrdersContainer" style="overflow-x: auto;">
            <div class="loader"><span class="spinner"></span> 載入訂單中...</div>
          </div>
        </div>

        <div style="background:#fff8f8; border:1px solid #fad2d2; border-radius:8px; padding:14px; margin-bottom:15px;">
          <label style="color:var(--danger);">🗑️ 清空今日所有點餐紀錄</label>
          <p style="font-size: 0.8rem; color: #777; margin-bottom: 8px;">
            將會清除「今日誰點餐」中的所有訂購資料，並保留標題列。
          </p>
          <button class="btn-danger" onclick="handleAdminClearOrders()">清空今日所有紀錄</button>
        </div>

        <button class="btn-back" onclick="exitAdmin()">↩ 返回點餐頁面</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="customModal">
    <div class="modal-card">
      <div class="modal-icon" id="modalIcon">🎉</div>
      <div class="modal-title" id="modalTitle">提示</div>
      <div class="modal-msg" id="modalMsg">訊息內容</div>
      <div class="modal-btn-group">
        <button class="modal-btn modal-btn-cancel" id="modalCancelBtn" style="display:none;" onclick="closeModal()">取消</button>
        <button class="modal-btn" id="modalConfirmBtn" onclick="closeModal()">賀哦，哇災！</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="adminLoginModal" style="z-index: 1000;">
    <div class="modal-card">
      <div class="modal-icon">🔐</div>
      <div class="modal-title">管理員身份驗證</div>
      <div class="form-group" style="margin-top: 12px; text-align: left;">
        <label>請輸入管理密碼：</label>
        <input type="password" id="adminPasswordInput" placeholder="輸入後台密碼" onkeypress="if(event.key === 'Enter') submitAdminLogin()">
      </div>
      <div style="display: flex; gap: 8px; justify-content: center; margin-top: 10px;">
        <button class="modal-btn modal-btn-cancel" style="padding: 8px 16px;" onclick="closeAdminModal()">取消</button>
        <button class="modal-btn" style="padding: 8px 16px;" onclick="submitAdminLogin()">登入後台</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycby62Gqr10uIr_dLCbFDSA79jw4f4fkFlhGBRiXo-IEh3Ikx5RkFJzHEayKFdxUZgHmlDA/exec"; 
    const ADMIN_PASSWORD = "6767"; 

    // ====== 連線相關調整參數（可依需求微調）======
    const REQUEST_TIMEOUT_MS = 30000;   // 單次請求逾時：20s → 30s，行動網路較常見的延遲更寬容
    const MAX_RETRIES = 2;              // 失敗重試次數
    const RETRY_BASE_DELAY_MS = 1200;   // 重試退避基準時間（會隨次數遞增）

    const groupMembersData = {
      "第一組": ["04 舒香雅", "10 施美美", "12 王麗敏", "18 江珈宜", "21 林彩葳", "26 林瑋妮"],
      "第二組": ["08 吳同祐", "09 劉靜文", "11 黃昱瑄", "20 郭貞纓", "27 陳玟妤", "29 簡雅珍"],
      "第三組": ["01 楊宜靜", "03 陳昱寧", "13 莊芯卉", "15 何婧湘", "17 羅懿", "19 廖慧蘭"],
      "第四組": ["06 邱韻如", "07 汪維嘉", "22 薛佩𠊙", "23 劉育均", "24 徐皜軒", "28 謝宛真"],
      "第五組": ["02 吳欣珉", "05 鍾涵茹", "14 劉曉珊", "16 薛席婷", "25 陳怡芳", "30 張語宸"],
      "教師組": ["助教", "老師"]
    };

    let currentShop = '';
    let menuItems = [];
    let allOrders = [];
    let allShopsList = [];
    let adminToken = '';
    let isFetchingData = false;
    let searchTimeout = null;

    function escapeHTML(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }

    function updateNameOptions() {
      const groupSelect = document.getElementById("groupSelect");
      const nameSelect = document.getElementById("nameSelect");
      const selectedGroup = groupSelect.value;
      nameSelect.innerHTML = "";

      if (!selectedGroup || !groupMembersData[selectedGroup]) {
        nameSelect.innerHTML = '<option value="">-- 請先選擇組別 --</option>';
        nameSelect.disabled = true;
        return;
      }

      nameSelect.innerHTML = '<option value="">-- 請選擇座號姓名 --</option>';
      groupMembersData[selectedGroup].forEach(member => {
        const opt = document.createElement("option");
        opt.value = member;
        opt.textContent = member;
        nameSelect.appendChild(opt);
      });
      nameSelect.disabled = false;
    }

    // ====== 核心改動：apiRequest ======
    // 1. timeout 拉長並可調整
    // 2. cache: 'no-store'，避免行動網路的中繼快取（電信商 / 瀏覽器）快取住失敗回應
    // 3. 重試改成「遞增退避」而非固定 1 秒
    // 4. 偵測回傳內容若是 HTML（代表被導去 Google 登入頁，通常是部署權限問題）給出明確訊息
    // 5. 連線失敗時觸發畫面上的紅色提示 banner
    async function apiRequest(action, data = {}, retries = MAX_RETRIES) {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        return new Promise((resolve, reject) => {
          let runner = google.script.run
            .withSuccessHandler(res => resolve(res))
            .withFailureHandler(err => reject(new Error(err.message || err)));

          if (action === 'getInitialData') runner.getInitialData();
          else if (action === 'getOrdersAndPaymentStatus') runner.getOrdersAndPaymentStatus();
          else if (action === 'submitOrder') runner.submitOrder(data.payload ? JSON.parse(data.payload) : data);
          else if (action === 'adminTogglePaid') runner.adminTogglePaid(data.password, data.rowIndex, data.newStatus);
          else if (action === 'adminChangeShop') runner.adminChangeShop(data.password, data.newShop);
          else if (action === 'adminClearAllOrders') runner.adminClearAllOrders(data.password);
          else reject(new Error("未知的動作: " + action));
        });
      }

      let lastErr = null;

      for (let attempt = 0; attempt <= retries; attempt++) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);

          const response = await fetch(GAS_API_URL, {
            method: 'POST',
            redirect: 'follow',
            cache: 'no-store',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: action, ...data }),
            signal: controller.signal
          });

          clearTimeout(timeoutId);

          if (!response.ok) throw new Error(`HTTP 錯誤狀態: ${response.status}`);

          const textResult = await response.text();

          // 偵測是否被導向 Google 登入頁 / 權限頁（回傳的是 HTML 而非 JSON）
          const trimmed = textResult.trim();
          if (trimmed.startsWith('<')) {
            throw new Error("伺服器回傳了非預期的內容，請確認 Apps Script 部署權限設定為「任何人」，且已重新部署最新版本。");
          }

          let jsonResult;
          try {
            jsonResult = JSON.parse(trimmed);
          } catch (e) {
            throw new Error("伺服器回傳格式異常，請稍後再試");
          }

          hideConnBanner();
          return jsonResult;
        } catch (err) {
          lastErr = err;
          if (attempt === retries) {
            showConnBanner();
            throw new Error(err.name === 'AbortError' ? '連線逾時，請檢查手機網路狀態後重試！' : (err.message || '無法連線至伺服器。'));
          }
          // 遞增退避：1.2s, 2.4s, 3.6s...
          await new Promise(resolve => setTimeout(resolve, RETRY_BASE_DELAY_MS * (attempt + 1)));
        }
      }
      throw lastErr || new Error('無法連線至伺服器。');
    }

    function showConnBanner() {
      const el = document.getElementById('connBanner');
      if (el) el.classList.add('show');
    }
    function hideConnBanner() {
      const el = document.getElementById('connBanner');
      if (el) el.classList.remove('show');
    }

    function showModal(title, msg, icon = '🎉', callback = null) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalMsg').innerText = msg;
      document.getElementById('modalIcon').innerText = icon;
      document.getElementById('modalCancelBtn').style.display = 'none';
      const confirmBtn = document.getElementById('modalConfirmBtn');
      confirmBtn.innerText = '賀哦，哇災！';
      confirmBtn.onclick = closeModal;
      modalCallback = callback;
      document.getElementById('customModal').style.display = 'flex';
    }

    function showConfirmModal(title, msg, icon = '❓', onConfirm = null) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalMsg').innerText = msg;
      document.getElementById('modalIcon').innerText = icon;
      document.getElementById('modalCancelBtn').style.display = 'inline-block';
      const confirmBtn = document.getElementById('modalConfirmBtn');
      confirmBtn.innerText = '確定';
      confirmBtn.onclick = function() { closeModal(); if (onConfirm) onConfirm(); };
      modalCallback = null;
      document.getElementById('customModal').style.display = 'flex';
    }

    let modalCallback = null;
    function closeModal() {
      document.getElementById('customModal').style.display = 'none';
      if (modalCallback) { modalCallback(); modalCallback = null; }
    }

    window.onload = function() {
      const savedGroup = localStorage.getItem('lunchApp_group');
      const savedName = localStorage.getItem('lunchApp_name');

      if (savedGroup) {
        document.getElementById('groupSelect').value = savedGroup;
        updateNameOptions();
        if (savedName) document.getElementById('nameSelect').value = savedName;
      }

      const cachedData = localStorage.getItem('lunchApp_cachedData');
      if (cachedData) {
        try {
          const res = JSON.parse(cachedData);
          applyDataToUI(res);
        } catch(e) {}
      }

      loadInitialData();
    };

    function applyDataToUI(res) {
      currentShop = res.shop || '尚未設定店家';
      menuItems = res.items || [];
      allShopsList = res.allShops || [];
      if (res.orders) allOrders = res.orders;

      document.getElementById('currentShopText').innerText = '今日店家：' + currentShop;
      renderMenuList();

      if(document.getElementById('itemList').children.length === 0) {
        addItemRow();
      } else {
        updateExistingItemRows();
      }

      populateAdminShopsSelect();
      renderOrders(allOrders);
      if (document.getElementById('tab-admin').style.display === 'block') {
         renderAdminTable(allOrders);
      }
    }

    function updateExistingItemRows() {
      let options = '<option value="" data-price="0">-- 請選擇餐點品項 --</option>';
      menuItems.forEach(item => {
        options += `<option value="${escapeHTML(item.name)}" data-price="${item.price}">${escapeHTML(item.name)} ($${item.price})</option>`;
      });
      document.querySelectorAll('.item-row select').forEach(select => {
        const val = select.value;
        select.innerHTML = options;
        select.value = val;
      });
      calculateTotal();
    }

    // 載入初始資料：加上失敗重試按鈕、避免使用者卡在無限轉圈畫面
    async function loadInitialData() {
      if(isFetchingData) return;
      isFetchingData = true;
      try {
        const res = await apiRequest('getInitialData');
        if (res && res.success) {
          localStorage.setItem('lunchApp_cachedData', JSON.stringify(res));
          applyDataToUI(res);
        } else if (res && !res.success) {
          throw new Error(res.message || '讀取資料失敗');
        }
      } catch (err) {
        if (menuItems.length === 0) {
          document.getElementById('currentShopText').innerHTML = '⚠️ 連線失敗';
          const menuDiv = document.getElementById('menuList');
          if (menuDiv) {
            menuDiv.innerHTML =
              '<div class="retry-box">讀取失敗：' + escapeHTML(err.message) +
              '<br><button class="btn-action retry-btn" onclick="loadInitialData()">🔄 重新嘗試</button></div>';
          }
        }
      } finally {
        isFetchingData = false;
      }
    }

    function switchTab(tabId) {
      document.getElementById('tab-order').style.display = 'none';
      document.getElementById('tab-status').style.display = 'none';
      document.getElementById('tab-menu').style.display = 'none';
      document.getElementById('tab-admin').style.display = 'none';
      document.getElementById('mainTabs').style.display = 'flex';

      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

      if (tabId === 'order') {
        document.getElementById('tab-order').style.display = 'block';
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
      } else if (tabId === 'status') {
        document.getElementById('tab-status').style.display = 'block';
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        renderOrders(allOrders);
        loadStatusData(false); // 進入時背景靜默同步
      } else if (tabId === 'menu') {
        document.getElementById('tab-menu').style.display = 'block';
        document.querySelectorAll('.tab-btn')[2].classList.add('active');
      }
    }

    function addItemRow() {
      const container = document.getElementById('itemList');
      const rows = container.querySelectorAll('.item-row');
      if (rows.length >= 5) {
        showModal('提醒', '最多只能點選 5 項餐點！', 'ℹ️');
        return;
      }

      const row = document.createElement('div');
      row.className = 'item-row';
      let options = '<option value="" data-price="0">-- 請選擇餐點品項 --</option>';
      menuItems.forEach(item => {
        options += `<option value="${escapeHTML(item.name)}" data-price="${item.price}">${escapeHTML(item.name)} ($${item.price})</option>`;
      });

      row.innerHTML = `
        <select onchange="calculateTotal()">${options}</select>
        <span class="price-tag">$0</span>
        <button type="button" class="btn-remove" onclick="removeItemRow(this)" title="移除此項">✕</button>
      `;
      container.appendChild(row);
      if (container.querySelectorAll('.item-row').length >= 5) {
        document.getElementById('btnAddItem').style.display = 'none';
      }
    }

    function removeItemRow(btn) {
      btn.parentElement.remove();
      document.getElementById('btnAddItem').style.display = 'block';
      calculateTotal();
    }

    function calculateTotal() {
      let total = 0;
      document.querySelectorAll('.item-row').forEach(r => {
        const select = r.querySelector('select');
        const price = Number(select.options[select.selectedIndex]?.getAttribute('data-price')) || 0;
        r.querySelector('.price-tag').innerText = '$' + price;
        total += price;
      });
      document.getElementById('totalDisplay').innerText = '$' + total;
      return total;
    }

    async function handleOrderSubmit() {
      const group = document.getElementById('groupSelect').value;
      const name = document.getElementById('nameSelect').value;
      if (!group || !name) return showModal('請確認', '請選擇組別與姓名！', '⚠️');

      const selectedItems = [];
      document.querySelectorAll('.item-row select').forEach(s => { if (s.value) selectedItems.push(s.value); });
      if (selectedItems.length === 0) return showModal('請確認', '請至少選擇一項餐點！', '⚠️');

      localStorage.setItem('lunchApp_group', group);
      localStorage.setItem('lunchApp_name', name);

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner" style="width:16px;height:16px;border-width:2px;border-top-color:#fff;"></span> 送出處理中...';

      const payload = {
        shop: currentShop, group: group, name: name,
        note: document.getElementById('orderNote').value.trim(),
        totalAmount: calculateTotal(), items: selectedItems
      };

      try {
        const res = await apiRequest('submitOrder', { payload: JSON.stringify(payload) });
        if (res && res.success) {
          showModal('點餐成功！', '記得要繳錢呦(๑•̀ㅂ•́)و✧', '🎉', function() {
            document.getElementById('orderNote').value = '';
            document.getElementById('itemList').innerHTML = '';
            addItemRow();
            calculateTotal();
            loadStatusData(true);
            switchTab('status');
          });
        } else {
          showModal('送出失敗', res ? res.message : '發生未知錯誤', '❌');
        }
      } catch (err) {
        showModal('系統錯誤', err.message, '❌');
      } finally {
        btn.disabled = false;
        btn.innerText = '確認送出點餐';
      }
    }

    async function loadStatusData(forceRefresh = false) {
      if (!forceRefresh && allOrders.length > 0) {
        renderOrders(allOrders);
      }

      try {
        const res = await apiRequest('getOrdersAndPaymentStatus');
        if (res && res.success) {
          allOrders = res.data || [];
          updateCache('orders', allOrders);
          renderOrders(allOrders);
        }
      } catch (err) {
        // 靜默同步失敗時，若目前列表是空的，仍要讓使用者知道並可重試
        if (allOrders.length === 0) {
          const listDiv = document.getElementById('statusList');
          if (listDiv) {
            listDiv.innerHTML =
              '<div class="retry-box">讀取失敗：' + escapeHTML(err.message) +
              '<br><button class="btn-action retry-btn" onclick="loadStatusData(true)">🔄 重新嘗試</button></div>';
          }
        }
      }
    }

    function updateCache(key, value) {
      try {
        let cache = JSON.parse(localStorage.getItem('lunchApp_cachedData') || '{}');
        cache[key] = value;
        localStorage.setItem('lunchApp_cachedData', JSON.stringify(cache));
      } catch(e) {}
    }

    function renderOrders(orders) {
      const listDiv = document.getElementById('statusList');
      if (!orders || orders.length === 0) {
        listDiv.innerHTML = '<div style="text-align:center; color:#888; padding:20px;">目前尚無點餐紀錄</div>';
        return;
      }
      let html = '';
      orders.forEach(o => {
        const badge = o.paid ? '<span class="badge badge-paid">✔ 已繳費</span>' : '<span class="badge badge-unpaid">✖ 未繳費</span>';
        const safeGroup = escapeHTML(o.group);
        const safeName = escapeHTML(o.name);
        html += `
          <div class="order-item">
            <div class="order-header">
              <span class="order-user">${safeGroup ? '[' + safeGroup + '] ' : ''}${safeName}</span>${badge}
            </div>
            <div class="order-details">
              <strong>金額：</strong>$${o.total} | <strong>時間：</strong>${escapeHTML(o.time) || '今日'}<br>
              <strong>品項：</strong>${escapeHTML(o.itemsSummary) || '無'}<br>
              ${o.note ? '<strong>備註：</strong>' + escapeHTML(o.note) : ''}
            </div>
          </div>`;
      });
      listDiv.innerHTML = html;
    }

    function filterStatus() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        const kw = document.getElementById('statusFilter').value.toLowerCase();
        const filtered = allOrders.filter(o => (o.name && o.name.toLowerCase().includes(kw)) || (o.group && o.group.toString().toLowerCase().includes(kw)));
        renderOrders(filtered);
      }, 300);
    }

    function renderMenuList() {
      const menuDiv = document.getElementById('menuList');
      if (menuItems.length === 0) return menuDiv.innerHTML = '<div style="text-align:center; color:#888; padding:20px;">查無今日店家的菜單資料</div>';

      let html = '<table style="width:100%; border-collapse: collapse; font-size:0.9rem;">';
      html += '<tr style="background:#f4f7f7; color:#1f4e5f; text-align:left;"><th style="padding:10px;">品項名稱</th><th style="padding:10px; text-align:right;">單價</th></tr>';
      menuItems.forEach(item => {
        html += `<tr style="border-bottom: 1px solid #eee;">
          <td style="padding:10px;">${escapeHTML(item.name)}</td>
          <td style="padding:10px; text-align:right; font-weight:bold; color:#1f4e5f;">$${item.price}</td>
        </tr>`;
      });
      html += '</table>';
      menuDiv.innerHTML = html;
    }

    function openAdminModal() {
      document.getElementById('adminPasswordInput').value = '';
      document.getElementById('adminLoginModal').style.display = 'flex';
      setTimeout(() => document.getElementById('adminPasswordInput').focus(), 100);
    }
    function closeAdminModal() { document.getElementById('adminLoginModal').style.display = 'none'; }
    function submitAdminLogin() {
      const pwd = document.getElementById('adminPasswordInput').value;
      if (pwd !== ADMIN_PASSWORD) return showModal('毋對喔', '密碼錯誤，請再試一次', '❌');
      adminToken = pwd;
      closeAdminModal();
      enterAdminPanel();
    }

    function enterAdminPanel() {
      document.getElementById('tab-order').style.display = 'none';
      document.getElementById('tab-status').style.display = 'none';
      document.getElementById('tab-menu').style.display = 'none';
      document.getElementById('mainTabs').style.display = 'none';
      document.getElementById('tab-admin').style.display = 'block';
      window.scrollTo(0, 0);
      populateAdminShopsSelect();

      // 秒開：直接用現有記憶體資料渲染，不等待網路
      renderAdminTable(allOrders);
      // 背景靜默更新最新對帳狀態
      loadAdminOrders(false);
    }

    function exitAdmin() {
      document.getElementById('tab-admin').style.display = 'none';
      switchTab('order');
    }

    function populateAdminShopsSelect() {
      const select = document.getElementById('adminShopsSelect');
      if (!select) return;
      select.innerHTML = '';
      allShopsList.forEach(s => {
        const opt = document.createElement('option');
        opt.value = escapeHTML(s); opt.innerText = escapeHTML(s);
        if (s === currentShop) opt.selected = true;
        select.appendChild(opt);
      });
    }

    function handleAdminChangeShop() {
      const newShop = document.getElementById('adminShopsSelect').value;
      if (!newShop) return;
      showConfirmModal('切換確認', `確定切換店家為【${newShop}】嗎？`, '🏪', async function() {
        try {
          const res = await apiRequest('adminChangeShop', { password: adminToken, newShop: newShop });
          showModal(res && res.success ? '成功' : '失敗', res ? res.message : '', res && res.success ? '✅' : '❌', function() {
            if (res && res.success) loadInitialData();
          });
        } catch (err) { showModal('操作失敗', err.message, '❌'); }
      });
    }

    async function handleTogglePaid(orderId, btnElement) {
      if (btnElement.disabled) return;
      const targetOrder = allOrders.find(o => o.rowIndex === orderId);
      if (!targetOrder) return;

      const originalStatus = targetOrder.paid;
      const newStatus = !originalStatus;

      targetOrder.paid = newStatus;
      updateBadgeUI(btnElement, newStatus);
      updateAdminStatistics(allOrders);
      btnElement.disabled = true;

      try {
        const res = await apiRequest('adminTogglePaid', { password: adminToken, rowIndex: orderId, newStatus: newStatus });
        if (!res || !res.success) throw new Error((res && res.message) || "同步更新失敗");
        updateCache('orders', allOrders);
      } catch (err) {
        targetOrder.paid = originalStatus;
        updateBadgeUI(btnElement, originalStatus);
        updateAdminStatistics(allOrders);
        showModal('同步失敗', "無法連線更新，狀態已自動還原！\n(" + err.message + ")", '⚠️');
      } finally {
        btnElement.disabled = false;
      }
    }

    function updateBadgeUI(btnElement, isPaid) {
      if (isPaid) {
        btnElement.innerText = "✔ 已付款"; btnElement.className = "badge badge-paid paid";
      } else {
        btnElement.innerText = "✖ 未付款"; btnElement.className = "badge badge-unpaid";
      }
    }

    async function loadAdminOrders(forceRefresh = false) {
      if (forceRefresh && allOrders.length === 0) {
        document.getElementById('adminOrdersContainer').innerHTML = '<div class="loader"><span class="spinner"></span> 載入訂單中...</div>';
      }

      try {
        const res = await apiRequest('getOrdersAndPaymentStatus');
        if (res && res.success) {
          allOrders = res.data || [];
          updateCache('orders', allOrders);
          renderAdminTable(allOrders);
        }
      } catch (err) {
        if (allOrders.length === 0) {
          document.getElementById('adminOrdersContainer').innerHTML =
            '<div class="retry-box" style="color:var(--danger);">讀取失敗：' + escapeHTML(err.message) +
            '<br><button class="btn-action retry-btn" onclick="loadAdminOrders(true)">🔄 重新嘗試</button></div>';
        }
      }
    }

    function renderAdminTable(orders) {
      const container = document.getElementById('adminOrdersContainer');
      updateAdminStatistics(orders);

      if (!orders || orders.length === 0) {
        container.innerHTML = '<div style="padding:15px; color:#888; text-align:center;">目前尚無任何點餐紀錄。</div>';
        return;
      }

      let html = `<table class="admin-table"><thead><tr><th>組別</th><th>姓名</th><th>總額</th><th>點餐品項與備註</th><th>繳費狀態</th></tr></thead><tbody>`;
      orders.forEach(r => {
        const btnClass = r.paid ? "badge badge-paid paid" : "badge badge-unpaid";
        const btnText = r.paid ? "✔ 已付款" : "✖ 未付款";
        html += `<tr>
          <td>${escapeHTML(r.group) || '-'}</td>
          <td><strong>${escapeHTML(r.name)}</strong></td>
          <td style="font-weight:bold; color:var(--primary);">$${r.total}</td>
          <td>${escapeHTML(r.itemsSummary) || ''}${r.note ? '<br><small style="color:#777;">備註：' + escapeHTML(r.note) + '</small>' : ''}</td>
          <td style="text-align:center;"><button class="${btnClass}" onclick="handleTogglePaid(${r.rowIndex}, this)">${btnText}</button></td>
        </tr>`;
      });
      html += '</tbody></table>';
      container.innerHTML = html;
    }

    function updateAdminStatistics(orders) {
      let total = 0, paid = 0;
      if (orders) {
        orders.forEach(o => {
          const amt = Number(o.total) || 0;
          total += amt;
          if (o.paid) paid += amt;
        });
      }
      document.getElementById('statOrderCount').innerText = (orders ? orders.length : 0) + ' 筆';
      document.getElementById('statTotalAmount').innerText = '$' + total;
      document.getElementById('statPaidAmount').innerText = '$' + paid;
      document.getElementById('statUnpaidAmount').innerText = '$' + (total - paid);
    }

    function handleAdminClearOrders() {
      showConfirmModal('清空警告', '確定要清空今日所有紀錄嗎？', '⚠️', async function() {
        try {
          const res = await apiRequest('adminClearAllOrders', { password: adminToken });
          showModal(res && res.success ? '清空完成' : '清空失敗', res ? res.message : '', res && res.success ? '🗑️' : '❌', function() {
            if (res && res.success) { allOrders = []; updateCache('orders', []); renderAdminTable([]); }
          });
        } catch (err) { showModal('清空失敗', err.message, '❌'); }
      });
    }
  </script>
</body>
</html>
