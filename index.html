<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F4F6F8">
<title>今天要吃什麼勒</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* --- 防溢出與基礎重設 --- */
html, body {
    width: 100%;
    overflow-x: hidden; /* 強制隱藏超出的水平空間，防止左右滑動 */
    margin: 0;
    padding: 0;
}

/* 確保所有元素的 padding 和 border 不會外擴增加總寬度 */
*, *::before, *::after {
    box-sizing: border-box;
    font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-tap-highlight-color: transparent;
}

/* --- 按鈕容器與防重疊設定 --- */
.button-container {
    display: flex;
    flex-wrap: wrap; /* 螢幕寬度不足時自動換行，防止按鈕重疊 */
    gap: 16px; /* 設定按鈕之間的間距 */
    justify-content: center;
    align-items: center;
    max-width: 100%; /* 限制最大寬度，避免撐破外層 */
}

.button-item {
    max-width: 100%; 
    white-space: nowrap; /* 保持按鈕內文字不換行 */
}

/* 🎨 現代化 UI 主題變數 */
:root {
  --bg: #F4F6F9;
  --surface: rgba(255, 255, 255, 0.85);
  --surface-solid: #FFFFFF;
  --text-main: #0F172A;
  --text-muted: #64748B;
  --primary: #FF5A5F;
  --primary-hover: #E0484D;
  --secondary: #FFB320;
  --accent: #0EA5E9;
  --danger: #FF3B30;
  --danger-bg: #FFE5E5;
  --success: #10B981;
  --success-bg: #D1FAE5;
  --border: rgba(15, 23, 42, 0.08);
  --glass-border: rgba(255, 255, 255, 0.6);
  
  --shadow-sm: 0 4px 12px rgba(15, 23, 42, 0.03);
  --shadow-md: 0 12px 32px rgba(15, 23, 42, 0.06), 0 2px 6px rgba(15, 23, 42, 0.03);
  --shadow-lg: 0 24px 48px rgba(15, 23, 42, 0.08);
  --shadow-glow: 0 8px 24px rgba(255, 90, 95, 0.3);
  
  --r-lg: 32px;
  --r-md: 20px;
  --r-sm: 14px;
  --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}

html { scroll-behavior: smooth; background-color: var(--bg); }

/* 現代化點狀網格背景 */
body {
  background-color: var(--bg);
  background-image: radial-gradient(circle at 1px 1px, rgba(15, 23, 42, 0.08) 1px, transparent 0);
  background-size: 28px 28px;
  color: var(--text-main);
  padding-bottom: calc(80px + env(safe-area-inset-bottom));
  line-height: 1.6;
  min-height: 100vh;
  position: relative;
}

/* 背景裝飾光暈 */
body::before, body::after {
  content: ""; position: absolute; border-radius: 50%; filter: blur(80px); z-index: -1; pointer-events: none; opacity: 0.5;
}
body::before { width: 400px; height: 400px; background: rgba(255, 179, 32, 0.2); top: -100px; right: -150px; }
body::after { width: 300px; height: 300px; background: rgba(255, 90, 95, 0.15); top: 20%; left: -100px; }

button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--secondary); outline-offset: 2px; border-radius: 4px; }

/* 頂部連線提示 */
.conn-banner { display: none; background: var(--danger); color: #fff; font-size: 0.85rem; font-weight: 700; text-align: center; padding: 10px 16px; box-shadow: var(--shadow-sm); z-index: 9999; position: relative; }
.conn-banner.show { display: block; animation: slideDown 0.4s var(--spring); }
@keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: none; opacity: 1; } }

/* Header - 極簡玻璃風格 */
header {
  position: relative; padding: calc(40px + env(safe-area-inset-top)) 24px 72px; text-align: center; z-index: 1;
}
.head-inner { position: relative; max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; }
header h1 { font-size: 1rem; font-weight: 700; letter-spacing: 0.1em; color: var(--text-muted); background: rgba(255,255,255,0.6); padding: 6px 16px; border-radius: 99px; display: inline-block; box-shadow: var(--shadow-sm); border: 1px solid var(--glass-border); margin-bottom: 24px; }
.shop-label { font-size: 0.85rem; font-weight: 500; color: var(--text-muted); margin-bottom: 4px; }

/* 今日店家標題 */
.shop-badge {
  display: block; font-size: clamp(2.4rem, 9vw, 4rem); font-weight: 900; line-height: 1.2; letter-spacing: -0.03em;
  background: linear-gradient(135deg, var(--text-main) 0%, #334155 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  animation: floatUp 0.8s var(--spring) both; word-break: break-word; text-shadow: 0 12px 24px rgba(0,0,0,0.04);
}
.shop-badge.is-load, .shop-badge.is-err { font-size: 1.5rem; background: var(--text-muted); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: pulse 2s infinite ease-in-out; }

/* 管理員按鈕 */
.admin-entry-btn {
  position: absolute; top: 0; right: 0; background: rgba(255,255,255,0.7); border: 1px solid var(--glass-border); padding: 8px 16px; border-radius: 99px; font-size: 0.8rem; font-weight: 700; color: var(--text-muted); cursor: pointer; transition: 0.3s var(--ease); backdrop-filter: blur(8px); box-shadow: var(--shadow-sm);
}
.admin-entry-btn:hover { background: var(--text-main); color: #fff; transform: translateY(-2px); }

@keyframes floatUp { from { opacity: 0; transform: translateY(24px) scale(0.95); } to { opacity: 1; transform: none; } }
@keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

/* 玻璃質感導覽列 Tabs */
.tabs {
  display: flex; gap: 6px; max-width: 480px; margin: -32px auto 0; padding: 6px; background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1.5px solid var(--glass-border); border-radius: 99px; box-shadow: var(--shadow-md); position: sticky; top: 16px; z-index: 100; width: calc(100% - 32px); transition: 0.3s var(--ease);
}
.tab-btn {
  flex: 1; padding: 12px 8px; min-height: 44px; border: none; background: transparent; border-radius: 99px; font-size: 0.9rem; font-weight: 700; color: var(--text-muted); cursor: pointer; transition: 0.4s var(--spring); position: relative;
}
.tab-btn::before { content: ""; position: absolute; inset: 0; background: var(--text-main); border-radius: 99px; opacity: 0; transform: scale(0.8); transition: 0.4s var(--spring); z-index: -1; }
.tab-btn.active { color: #fff; }
.tab-btn.active::before { opacity: 1; transform: scale(1); box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2); }
.tab-btn:not(.active):hover { color: var(--text-main); background: rgba(0,0,0,0.03); }

/* 主容器 */
.container { max-width: 680px; margin: 32px auto; padding: 0 16px; }
.container > div { animation: slideIn 0.5s var(--spring) both; }
@keyframes slideIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

/* 卡片與表單 */
.card {
  background: var(--surface); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1.5px solid var(--glass-border); border-radius: var(--r-lg); padding: 32px; box-shadow: var(--shadow-md); margin-bottom: 24px; transition: 0.3s var(--ease);
}
.card-title { font-size: 1.4rem; font-weight: 900; margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; letter-spacing: -0.02em; }

.form-group { margin-bottom: 22px; }
label { display: block; font-size: 0.9rem; font-weight: 700; margin-bottom: 8px; color: var(--text-main); }
input[type=text], input[type=password], select {
  width: 100%; padding: 14px 16px; min-height: 52px; border: 1.5px solid rgba(15,23,42,0.1); border-radius: var(--r-sm); font-size: 1rem; background: var(--surface-solid); color: var(--text-main); outline: none; transition: 0.3s var(--ease); box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
}
select {
  appearance: none; background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%230F172A' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-position: calc(100% - 16px) center; background-size: 12px; background-repeat: no-repeat; padding-right: 40px; cursor: pointer;
}
select:disabled { background-color: #F8FAFC; opacity: 0.6; cursor: not-allowed; }
input:focus, select:focus { border-color: var(--secondary); box-shadow: 0 0 0 4px rgba(255, 179, 32, 0.15), inset 0 2px 4px rgba(0,0,0,0.01); }

/* 餐點列設計 */
.item-row {
  display: flex; gap: 12px; align-items: center; margin-bottom: 12px; animation: slideIn 0.4s var(--spring) both; background: rgba(255,255,255,0.5); padding: 8px; border-radius: var(--r-md); border: 1px solid var(--border);
}
.item-row select { flex: 2; border: none; box-shadow: none; background-color: transparent; padding: 10px; min-height: 44px; }
.item-row select:focus { box-shadow: none; background: #fff; border-radius: var(--r-sm); }
.price-tag { width: 70px; text-align: right; font-weight: 900; font-size: 1.1rem; color: var(--text-main); font-variant-numeric: tabular-nums; }
.btn-remove {
  width: 40px; height: 40px; flex: none; background: #fff; border: 1.5px solid var(--border); color: var(--text-muted); border-radius: 50%; font-weight: 900; cursor: pointer; transition: 0.3s var(--spring); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-sm);
}
.btn-remove:hover { background: var(--danger-bg); color: var(--danger); border-color: rgba(255,59,48,0.2); transform: rotate(90deg) scale(1.1); }

.btn-add-item {
  background: transparent; border: 2px dashed rgba(15,23,42,0.15); color: var(--text-muted); padding: 14px; min-height: 52px; width: 100%; border-radius: var(--r-sm); cursor: pointer; font-weight: 700; transition: 0.3s var(--ease); margin-top: 8px;
}
.btn-add-item:hover { background: rgba(15,23,42,0.02); border-color: var(--text-main); color: var(--text-main); }

/* 總結區塊 */
.summary-box {
  background: var(--surface-solid); border: 1.5px solid var(--border); border-radius: var(--r-md); padding: 20px 24px; margin: 32px 0 24px; display: flex; justify-content: space-between; align-items: center; font-weight: 700; box-shadow: var(--shadow-sm); position: relative; overflow: hidden;
}
.summary-box::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--secondary); }
.total-price { font-size: 2.4rem; font-weight: 900; letter-spacing: -0.02em; color: var(--text-main); font-variant-numeric: tabular-nums; display: inline-block; line-height: 1; }
.total-price.bump { animation: springBump 0.5s var(--spring); }
@keyframes springBump { 0% { transform: scale(1); } 40% { transform: scale(1.15) translateY(-2px); color: var(--primary); } 100% { transform: scale(1); } }

/* 按鈕樣式 */
.btn-submit {
  background: var(--primary); color: #fff; border: none; padding: 18px; min-height: 60px; width: 100%; border-radius: 99px; font-size: 1.1rem; font-weight: 900; letter-spacing: 0.05em; cursor: pointer; box-shadow: var(--shadow-glow); transition: 0.4s var(--spring); position: relative; overflow: hidden;
}
.btn-submit::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(255,255,255,0.2), transparent); opacity: 0; transition: 0.3s; }
.btn-submit:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(255, 90, 95, 0.4); }
.btn-submit:hover:not(:disabled)::after { opacity: 1; }
.btn-submit:active:not(:disabled) { transform: translateY(1px) scale(0.98); box-shadow: 0 4px 12px rgba(255, 90, 95, 0.2); }
.btn-submit:disabled { background: #CBD5E1; color: #94A3B8; box-shadow: none; cursor: not-allowed; }

.btn-action { background: var(--text-main); color: #fff; border: none; padding: 10px 18px; min-height: 40px; border-radius: 99px; font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: 0.3s var(--spring); box-shadow: var(--shadow-sm); }
.btn-action:hover { background: var(--secondary); color: var(--text-main); transform: translateY(-2px); }

.btn-danger { background: var(--danger); color: #fff; border: none; padding: 14px; min-height: 48px; border-radius: var(--r-sm); font-weight: 900; cursor: pointer; width: 100%; transition: 0.3s var(--spring); }
.btn-danger:hover { background: #E03329; transform: translateY(-2px); box-shadow: 0 8px 16px rgba(255,59,48,0.2); }

.btn-back { background: var(--surface-solid); color: var(--text-main); border: 1.5px solid var(--border); padding: 14px; min-height: 48px; border-radius: 99px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 12px; transition: 0.3s var(--spring); }
.btn-back:hover { background: var(--bg); transform: translateY(-2px); }

.search-box { margin-bottom: 20px; background: rgba(255,255,255,0.5) !important; border-radius: 99px !important; padding-left: 24px !important; }

/* 訂單列表 */
.order-item {
  position: relative; border: 1px solid var(--glass-border); border-radius: var(--r-md); padding: 18px 20px 18px 24px; margin-bottom: 16px; background: var(--surface-solid); overflow: hidden; animation: slideIn 0.5s var(--spring) both; animation-delay: calc(var(--i, 0) * 60ms); box-shadow: var(--shadow-sm); transition: 0.3s var(--ease);
}
.order-item:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: rgba(15,23,42,0.1); }
.order-item::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--danger); transition: 0.4s ease; }
.order-item.is-paid::before { background: var(--success); }

.order-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
.order-user { font-weight: 900; font-size: 1.1rem; color: var(--text-main); letter-spacing: -0.01em; }
.order-details { font-size: 0.9rem; line-height: 1.6; color: var(--text-muted); }
.order-details strong { color: var(--text-main); }

/* Badge */
.badge { padding: 6px 14px; border-radius: 99px; font-size: 0.75rem; font-weight: 800; border: none; cursor: pointer; white-space: nowrap; transition: 0.3s var(--spring); letter-spacing: 0.03em; }
.badge-paid, .badge.paid { background: var(--success-bg); color: var(--success); }
.badge-unpaid { background: var(--danger-bg); color: var(--danger); }
span.badge { cursor: default; }
.badge:disabled { opacity: 0.5; cursor: wait; }
button.badge:hover:not(:disabled) { filter: brightness(0.95); transform: translateY(-1px); }
button.badge:active:not(:disabled) { transform: scale(0.92); }

/* 後台管理區塊 */
.admin-badge { background: var(--secondary); color: var(--text-main); font-size: 0.72rem; font-weight: 900; padding: 4px 10px; border-radius: 99px; margin-left: 8px; vertical-align: middle; }
.admin-stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 24px; }
.stat-card { background: var(--surface-solid); border: 1px solid var(--border); border-radius: var(--r-md); padding: 16px; box-shadow: var(--shadow-sm); transition: 0.3s; }
.stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.stat-label { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); }
.stat-num { font-size: 1.8rem; font-weight: 900; margin-top: 4px; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

.panel { border: 1px solid var(--border); border-radius: var(--r-md); padding: 20px; margin-bottom: 20px; background: var(--surface-solid); box-shadow: var(--shadow-sm); }
.panel.danger { border: 1px solid rgba(255,59,48,0.2); background: #FFF9F9; }

/* 表格設定 */
.admin-table, .menu-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.9rem; }
.admin-table { min-width: 560px; }
.admin-table th, .admin-table td { border-bottom: 1px solid var(--border); padding: 14px 10px; text-align: left; }
.admin-table th { font-weight: 800; color: var(--text-muted); text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.05em; padding-bottom: 12px; }
.admin-table tr:last-child td { border-bottom: none; }

.menu-table td { padding: 16px 8px; border-bottom: 1px dashed rgba(15,23,42,0.1); }
.menu-table tr:last-child td { border-bottom: none; }
.menu-table td:last-child { text-align: right; font-weight: 900; font-size: 1.1rem; color: var(--text-main); font-variant-numeric: tabular-nums; }

.empty { text-align: center; padding: 40px 20px; font-weight: 700; color: var(--text-muted); background: rgba(255,255,255,0.4); border-radius: var(--r-md); border: 1px dashed var(--border); }
.loader, .retry-box { text-align: center; padding: 40px 20px; font-weight: 700; color: var(--text-muted); }

/* Loading 動畫 */
.spinner {
  display: inline-block; width: 22px; height: 22px; border: 3px solid rgba(15,23,42,0.1); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite; vertical-align: middle; margin-right: 10px;
}
header .spinner { border-color: rgba(255,255,255,0.2); border-top-color: #fff; }
.btn-submit .spinner { border-color: rgba(255,255,255,0.3); border-top-color: #fff; width: 18px; height: 18px; border-width: 2px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Modals */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 20px;
}
.modal-card {
  background: var(--surface-solid); border: 1px solid var(--glass-border); border-radius: var(--r-lg); padding: 32px 24px; max-width: 360px; width: 100%; text-align: center; box-shadow: var(--shadow-lg); animation: modalPop 0.5s var(--spring); position: relative; overflow: hidden;
}
@keyframes modalPop { 0% { transform: scale(0.9) translateY(20px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }

.modal-icon { font-size: 3.2rem; margin-bottom: 12px; filter: drop-shadow(0 8px 16px rgba(0,0,0,0.1)); animation: floatUp 0.6s var(--spring) 0.1s both; }
.modal-title { font-size: 1.3rem; font-weight: 900; margin-bottom: 10px; color: var(--text-main); }
.modal-msg { font-size: 0.95rem; margin-bottom: 28px; color: var(--text-muted); white-space: pre-line; line-height: 1.6; }

.modal-btn-group { 
  display: flex; 
  flex-wrap: wrap; 
  gap: 12px; 
}
.modal-btn {
  flex: 1; background: var(--text-main); color: #fff; border: none; padding: 14px; min-height: 52px; border-radius: 99px; font-weight: 800; cursor: pointer; transition: 0.3s var(--spring); box-shadow: var(--shadow-sm); min-width: 120px;
}
.modal-btn:hover { background: var(--secondary); color: var(--text-main); transform: translateY(-2px); }
.modal-btn-cancel { background: var(--bg); color: var(--text-main); }
.modal-btn-cancel:hover { background: #E2E8F0; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
@media (max-width: 480px) {
  header { padding: calc(32px + env(safe-area-inset-top)) 20px 60px; }
  .shop-badge { font-size: 2.2rem; }
  .card { padding: 24px 20px; }
}
</style>
</head>
<body>
<div class="conn-banner" id="connBanner">修但幾勒，正在重新連線…</div>

<header>
  <div class="head-inner">
    <h1>🍱 今天要吃什麼勒</h1>
    <button class="admin-entry-btn button-item" onclick="openAdminModal()" title="後台管理">🔒 管理員</button>
    <div class="shop-label">今日店家</div>
    <span class="shop-badge is-load" id="currentShopText"><span class="spinner"></span>載入中…</span>
  </div>
</header>

<div class="tabs" id="mainTabs">
  <button class="tab-btn active" onclick="switchTab('order')">我要點餐</button>
  <button class="tab-btn" onclick="switchTab('status')">對帳與查詢</button>
  <button class="tab-btn" onclick="switchTab('menu')">今日菜單</button>
</div>

<div class="container">
  <!-- 點餐頁籤 -->
  <div id="tab-order">
    <div class="card">
      <div class="card-title">填寫訂購資訊</div>
      <div class="form-group">
        <label for="groupSelect">組別 *</label>
        <select id="groupSelect" onchange="updateNameOptions()">
          <option value="">請選擇組別</option>
          <option value="第一組">第一組</option>
          <option value="第二組">第二組</option>
          <option value="第三組">第三組</option>
          <option value="第四組">第四組</option>
          <option value="第五組">第五組</option>
          <option value="教師組">教師組</option>
        </select>
      </div>
      <div class="form-group">
        <label for="nameSelect">座號與姓名 *</label>
        <select id="nameSelect" disabled><option value="">請先選擇組別</option></select>
      </div>
      <div class="form-group">
        <label>餐點品項（最多 5 項）</label>
        <div id="itemList"></div>
        <button type="button" class="btn-add-item button-item" id="btnAddItem" onclick="addItemRow()">+ 新增一項餐點</button>
      </div>
      <div class="form-group">
        <label for="orderNote">備註</label>
        <input type="text" id="orderNote" placeholder="不一定要填">
      </div>
      <div class="summary-box">
        <span>應付總金額</span>
        <span class="total-price" id="totalDisplay">$0</span>
      </div>
      <button class="btn-submit button-item" id="submitBtn" onclick="handleOrderSubmit()">送出點餐</button>
    </div>
  </div>

  <!-- 狀態查詢頁籤 -->
  <div id="tab-status" style="display:none;">
    <div class="card">
      <div class="card-title">
        <span>點餐與繳費狀態</span>
        <button class="btn-action button-item" id="btnRefreshStatus" onclick="loadStatusData(true)">重新整理</button>
      </div>
      <input type="text" id="statusFilter" class="search-box" placeholder="輸入姓名或組別搜尋" oninput="filterStatus()">
      <div id="statusList" class="loader"><span class="spinner"></span>載入紀錄中…</div>
    </div>
  </div>

  <!-- 菜單頁籤 -->
  <div id="tab-menu" style="display:none;">
    <div class="card">
      <div class="card-title">今日菜單</div>
      <div id="menuList" class="loader"><span class="spinner"></span>載入菜單中…</div>
    </div>
  </div>

  <!-- 後台管理頁籤 -->
  <div id="tab-admin" style="display:none;">
    <div class="card">
      <div class="card-title">
        <div>管理員控制台<span class="admin-badge">已登入</span></div>
      </div>
      <div class="admin-stats-grid">
        <div class="stat-card"><div class="stat-label">今日訂單數</div><div class="stat-num" id="statOrderCount">0</div></div>
        <div class="stat-card"><div class="stat-label">訂單總金額</div><div class="stat-num" id="statTotalAmount">$0</div></div>
        <div class="stat-card"><div class="stat-label">已收金額</div><div class="stat-num" style="color:var(--success)" id="statPaidAmount">$0</div></div>
        <div class="stat-card"><div class="stat-label">未收金額</div><div class="stat-num" style="color:var(--danger)" id="statUnpaidAmount">$0</div></div>
      </div>
      <div class="panel">
        <label>切換今日店家</label>
        <div class="button-container" style="justify-content: flex-start; margin-top: 8px;">
          <select id="adminShopsSelect" style="flex: 1; min-width: 180px;"></select>
          <button class="btn-action button-item" style="white-space:nowrap; height: 52px" onclick="handleAdminChangeShop()">確認更換</button>
        </div>
      </div>
      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px">
          <label style="margin:0">對帳管理 <span style="font-size:0.75rem;font-weight:400;opacity:0.65;display:block;margin-top:4px">點擊狀態按鈕可切換已付／未付</span></label>
          <button class="btn-action button-item" id="btnRefreshAdmin" style="padding:6px 14px" onclick="loadAdminOrders(true)">重新整理</button>
        </div>
        <div id="adminOrdersContainer" style="overflow-x:auto"><div class="loader"><span class="spinner"></span>載入訂單中…</div></div>
      </div>
      <div class="panel danger">
        <label style="color:var(--danger)">清空今日所有點餐紀錄</label>
        <p style="font-size:0.85rem;margin-bottom:16px;color:var(--text-muted)">會清除「今日誰點餐」的所有訂購資料，標題列會保留。</p>
        <button class="btn-danger button-item" onclick="handleAdminClearOrders()">清空今日紀錄</button>
      </div>
      <button class="btn-back button-item" onclick="exitAdmin()">返回點餐頁面</button>
    </div>
  </div>
</div>

<!-- 提示彈窗 -->
<div class="modal-overlay" id="customModal" role="dialog" aria-modal="true">
  <div class="modal-card">
    <div class="modal-icon" id="modalIcon">🎉</div>
    <div class="modal-title" id="modalTitle">提示</div>
    <div class="modal-msg" id="modalMsg"></div>
    <div class="modal-btn-group button-container">
      <button class="modal-btn modal-btn-cancel button-item" id="modalCancelBtn" style="display:none" onclick="closeModal()">取消</button>
      <button class="modal-btn button-item" id="modalConfirmBtn" onclick="closeModal()">賀哦，哇災！</button>
    </div>
  </div>
</div>

<!-- 後台登入彈窗 -->
<div class="modal-overlay" id="adminLoginModal" style="z-index:2100" role="dialog" aria-modal="true">
  <div class="modal-card">
    <div class="modal-icon">🔐</div>
    <div class="modal-title">管理員驗證</div>
    <div class="form-group" style="margin-top:20px;text-align:left">
      <label for="adminPasswordInput">管理密碼</label>
      <input type="password" id="adminPasswordInput" placeholder="請輸入後台密碼" onkeypress="if(event.key==='Enter')submitAdminLogin()">
    </div>
    <div class="modal-btn-group button-container">
      <button class="modal-btn modal-btn-cancel button-item" onclick="closeAdminModal()">取消</button>
      <button class="modal-btn button-item" onclick="submitAdminLogin()">登入後台</button>
    </div>
  </div>
</div>

<script>
const GAS_API_URL = "https://script.google.com/macros/s/AKfycby62Gqr10uIr_dLCbFDSA79jw4f4fkFlhGBRiXo-IEh3Ikx5RkFJzHEayKFdxUZgHmlDA/exec";
const ADMIN_PASSWORD = "6767";
const REQUEST_TIMEOUT_MS = 30000, MAX_RETRIES = 2, RETRY_BASE_DELAY_MS = 1200;

const groupMembersData = {
  "第一組": ["04 舒香雅","10 施美美","12 王麗敏","18 江珈宜","21 林彩葳","26 林瑋妮"],
  "第二組": ["08 吳同祐","09 劉靜文","11 黃昱瑄","20 郭貞纓","27 陳玟妤","29 簡雅珍"],
  "第三組": ["01 楊宜靜","03 陳昱寧","13 莊芯卉","15 何婧湘","17 羅懿","19 廖慧蘭"],
  "第四組": ["06 邱韻如","07 汪維嘉","22 薛佩𠊙","23 劉育均","24 徐皜軒","28 謝宛真"],
  "第五組": ["02 吳欣珉","05 鍾涵茹","14 劉曉珊","16 薛席婷","25 陳怡芳","30 張語宸"],
  "教師組": ["助教","老師"]
};

let currentShop = '', menuItems = [], allOrders = [], allShopsList = [], adminToken = '';
let isFetchingData = false, searchTimeout = null, modalCallback = null;
const $ = id => document.getElementById(id);

function escapeHTML(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>'"]/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t] || t));
}

function updateNameOptions() {
  const sel = $("nameSelect"), g = $("groupSelect").value;
  sel.innerHTML = "";
  if (!g || !groupMembersData[g]) {
    sel.innerHTML = '<option value="">請先選擇組別</option>';
    sel.disabled = true;
    return;
  }
  sel.innerHTML = '<option value="">請選擇座號姓名</option>';
  groupMembersData[g].forEach(m => {
    const o = document.createElement("option");
    o.value = m; o.textContent = m; sel.appendChild(o);
  });
  sel.disabled = false;
}

async function apiRequest(action, data = {}, retries = MAX_RETRIES) {
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    return new Promise((resolve, reject) => {
      let runner = google.script.run
        .withSuccessHandler(res => resolve(res))
        .withFailureHandler(err => reject(new Error(err.message || err)));
      if (action === 'getInitialData') runner.getInitialData();
      else if (action === 'getOrdersAndPaymentStatus') runner.getOrdersAndPaymentStatus();
      else if (action === 'submitOrder') runner.submitOrder(data.payload ? JSON.parse(data.payload) : data);
      else if (action === 'adminTogglePaid') runner.adminTogglePaid(data.password, data.rowIndex, data.newStatus);
      else if (action === 'adminChangeShop') runner.adminChangeShop(data.password, data.newShop);
      else if (action === 'adminClearAllOrders') runner.adminClearAllOrders(data.password);
      else reject(new Error("未知的動作: " + action));
    });
  }
  let lastErr = null;
  for (let attempt = 0; attempt <= retries; attempt++) {
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
      const response = await fetch(GAS_API_URL, {
        method: 'POST', redirect: 'follow', cache: 'no-store',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: action, ...data }),
        signal: controller.signal
      });
      clearTimeout(timeoutId);
      if (!response.ok) throw new Error(`HTTP 錯誤狀態: ${response.status}`);
      const trimmed = (await response.text()).trim();
      if (trimmed.startsWith('<')) throw new Error("伺服器回傳了非預期的內容，請確認 Apps Script 部署權限設定為「任何人」，且已重新部署最新版本。");
      let jsonResult;
      try { jsonResult = JSON.parse(trimmed); } catch (e) { throw new Error("伺服器回傳格式異常，請稍後再試"); }
      hideConnBanner();
      return jsonResult;
    } catch (err) {
      lastErr = err;
      if (attempt === retries) {
        showConnBanner();
        throw new Error(err.name === 'AbortError' ? '連線逾時，請檢查手機網路狀態後重試！' : (err.message || '無法連線至伺服器。'));
      }
      await new Promise(r => setTimeout(r, RETRY_BASE_DELAY_MS * (attempt + 1)));
    }
  }
  throw lastErr || new Error('無法連線至伺服器。');
}

function showConnBanner() { $('connBanner').classList.add('show'); }
function hideConnBanner() { $('connBanner').classList.remove('show'); }

function showModal(title, msg, icon = '🎉', callback = null) {
  $('modalTitle').innerText = title; $('modalMsg').innerText = msg; $('modalIcon').innerText = icon;
  $('modalCancelBtn').style.display = 'none';
  const b = $('modalConfirmBtn'); b.innerText = '賀哦，哇災！'; b.onclick = closeModal;
  modalCallback = callback;
  $('customModal').style.display = 'flex'; b.focus();
}
function showConfirmModal(title, msg, icon = '❓', onConfirm = null) {
  $('modalTitle').innerText = title; $('modalMsg').innerText = msg; $('modalIcon').innerText = icon;
  $('modalCancelBtn').style.display = 'inline-block';
  const b = $('modalConfirmBtn'); b.innerText = '確定';
  b.onclick = function() { closeModal(); if (onConfirm) onConfirm(); };
  modalCallback = null;
  $('customModal').style.display = 'flex';
}
function closeModal() {
  $('customModal').style.display = 'none';
  if (modalCallback) { modalCallback(); modalCallback = null; }
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeAdminModal(); }
});

window.onload = function() {
  const g = localStorage.getItem('lunchApp_group'), n = localStorage.getItem('lunchApp_name');
  if (g) {
    $('groupSelect').value = g; updateNameOptions();
    if (n) $('nameSelect').value = n;
  }
  const cached = localStorage.getItem('lunchApp_cachedData');
  if (cached) { try { applyDataToUI(JSON.parse(cached)); } catch (e) {} }
  loadInitialData();
};

function applyDataToUI(res) {
  currentShop = res.shop || '尚未設定店家';
  menuItems = res.items || [];
  allShopsList = res.allShops || [];
  if (res.orders) allOrders = res.orders;
  const st = $('currentShopText');
  st.className = 'shop-badge'; st.innerText = currentShop;
  renderMenuList();
  if ($('itemList').children.length === 0) addItemRow(); else updateExistingItemRows();
  populateAdminShopsSelect();
  renderOrders(allOrders);
  if ($('tab-admin').style.display === 'block') renderAdminTable(allOrders);
}

function menuOptionsHTML() {
  let o = '<option value="" data-price="0">請選擇餐點品項</option>';
  menuItems.forEach(i => { o += `<option value="${escapeHTML(i.name)}" data-price="${i.price}">${escapeHTML(i.name)} ($${i.price})</option>`; });
  return o;
}
function updateExistingItemRows() {
  const options = menuOptionsHTML();
  document.querySelectorAll('.item-row select').forEach(s => { const v = s.value; s.innerHTML = options; s.value = v; });
  calculateTotal();
}

async function loadInitialData() {
  if (isFetchingData) return;
  isFetchingData = true;
  try {
    const res = await apiRequest('getInitialData');
    if (res && res.success) {
      localStorage.setItem('lunchApp_cachedData', JSON.stringify(res));
      applyDataToUI(res);
    } else if (res && !res.success) {
      throw new Error(res.message || '讀取資料失敗');
    }
  } catch (err) {
    console.error("載入初始資料失敗:", err);
    const st = $('currentShopText');
    if (st) {
      st.className = 'shop-badge is-err';
      st.innerText = '載入失敗，請重新整理';
    }
  } finally {
    isFetchingData = false;
  }
}
</script>
</body>
</html>
