.ic{display:inline-block;height:1em;background-repeat:no-repeat;background-position:center;background-size:contain;image-rendering:pixelated;image-rendering:crisp-edges;vertical-align:-.12em;flex:none}
.conn-banner{display:none;background:var(--danger);color:#fff;font-size:.85rem;font-weight:700;text-align:center;padding:10px 16px;border-bottom:var(--bd);position:relative;z-index:9999}
.conn-banner.show{display:block}
header{position:relative;padding:40px 24px 72px;padding:calc(40px + env(safe-area-inset-top)) 24px 72px;text-align:center;z-index:1;overflow:hidden;background:var(--forest);color:var(--text);border-bottom:4px solid var(--text)}
header::before{content:"";position:absolute;width:160px;height:160px;background:var(--green);right:-40px;top:-50px;box-shadow:-48px 96px 0 -8px var(--sage)}
.head-inner{position:relative;max-width:680px;margin:0 auto;display:flex;flex-direction:column;align-items:center}
.header-action-group{display:flex;align-items:center;gap:8px;margin-bottom:24px;flex-wrap:wrap;justify-content:center}
.title-pill{background:var(--surface);border:var(--bd);padding:8px 18px;box-shadow:var(--sh-sm);font-size:1.1rem;font-weight:900;color:var(--text);display:flex;align-items:center;gap:10px}
.title-pill .ic{font-size:38px}
.admin-pill{position:absolute;top:-24px;right:-8px;width:32px;height:32px;padding:0;display:flex;align-items:center;justify-content:center;font-size:1rem;border:2px solid rgba(19,21,21,.55);background:rgba(255,255,255,.25);opacity:.5;cursor:pointer}
.admin-pill:focus-visible{opacity:1;background:rgba(255,255,255,.25)}
.shop-label{font-size:.85rem;font-weight:800;color:var(--text);margin-bottom:4px}
.shop-badge{display:block;font-size:2.8rem;font-size:clamp(2.2rem,9vw,4rem);font-weight:900;line-height:1.3;color:#FFF8F0;text-shadow:3px 3px 0 var(--text);word-break:break-word}
.hl{background:linear-gradient(transparent 62%,var(--danger) 0) no-repeat 0 0/0 100%;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .08em;animation:swipe .6s .2s steps(8,end) forwards}
@keyframes swipe{to{background-size:100% 100%}}
.shop-badge.is-load,.shop-badge.is-err{font-size:1.5rem;color:var(--text);text-shadow:none;animation:pulse 1.2s steps(2) infinite}
header .spinner{border-color:rgba(19,21,21,.2);border-top-color:var(--text)}
@keyframes pulse{50%{opacity:.5}}
.tabs{display:flex;gap:0;max-width:480px;margin:-32px auto 0;padding:4px;background:var(--surface);border:var(--bd);box-shadow:var(--sh);position:relative;z-index:2;width:calc(100% - 32px)}
.tab-btn{flex:1;padding:10px 6px;min-height:44px;border:none;background:transparent;font-size:.9rem;font-weight:800;color:var(--muted);cursor:pointer;position:relative;z-index:1}
.tab-thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);background:var(--forest);transition:transform .25s steps(5,end);z-index:0}
.tabs[data-i="1"] .tab-thumb{transform:translateX(100%)}.tabs[data-i="2"] .tab-thumb{transform:translateX(200%)}
.tab-btn.active{color:var(--text)}
.container{max-width:680px;margin:32px auto;padding:0 16px}
.container>div{animation:slideIn .3s steps(4,end) both}
@keyframes slideIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card{background:var(--surface);border:var(--bd);padding:28px;box-shadow:6px 6px 0 var(--text);margin-bottom:24px}
.card-title{font-size:1.4rem;font-weight:900;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.form-group{margin-bottom:22px}
label{display:block;font-size:.9rem;font-weight:800;margin-bottom:8px}
input[type=text],input[type=password],select{width:100%;padding:12px 14px;min-height:52px;border:var(--bd);font-size:1rem;background:#fff;outline:none}

.spinner{display:inline-block;width:20px;height:20px;border:4px solid rgba(19,21,21,.12);border-top-color:var(--primary);border-radius:0;animation:spin .8s steps(4) infinite;vertical-align:middle;margin-right:10px}

let toggling = 0, ordersPromise = null, adminFilter = 'all', ordersVer = 0, ordersSig = '', ordersReady = false, cachedTxt = '';

function setSyncing(on) {

// 像素圖示對照：🎉→合格　⚠️→驚嘆號　❌/❓→叉叉　🔐→鎖　🍱→黑貓
const ICON_MAP = { '🎉': 'ok', '🎆': 'fan', '⚠️': 'warn', '❌': 'x', '❓': 'warn', '🔐': 'lock', '🍱': 'cat' };
function escapeHTML(s) {

}

// ---------- 時間（一律以台灣時間 UTC+8 顯示；今天只顯示 HH:mm，其他日子加上 MM/DD） ----------
const p2 = n => String(n).padStart(2, '0');
function tpeFmt(y, mo, d, h, mi) {
  const n = new Date(Date.now() + 288e5);
  const today = y === n.getUTCFullYear() && mo === n.getUTCMonth() + 1 && d === n.getUTCDate();
  return (today || y < 1971 ? '' : p2(mo) + '/' + p2(d) + ' ') + p2(h) + ':' + p2(mi);
}
function fmtTime(v) {
  if (v === undefined || v === null || v === '') return '';
  const str = typeof v === 'string' ? v.trim() : '';
  let m = str.match(/^(\d{1,2}):(\d{2})(?::\d{2})?$/);
  if (m) return p2(+m[1]) + ':' + m[2];
  let t = null;
  if (typeof v === 'number') t = new Date(v > 1e11 ? v : v * 1000);
  else if (/^\d{4}-\d{2}-\d{2}T[\d:.]+(Z|[+-]\d{2}:?\d{2})$/.test(str)) t = new Date(str);
  if (t) {
    if (isNaN(t)) return str || String(v);
    const u = new Date(t.getTime() + 288e5);
    return tpeFmt(u.getUTCFullYear(), u.getUTCMonth() + 1, u.getUTCDate(), u.getUTCHours(), u.getUTCMinutes());
  }
  m = str.match(/(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})[T\s]+(上午|下午|AM|PM)?\s*(\d{1,2}):(\d{2})/i);
  if (m) {
    let h = +m[5]; const ap = (m[4] || '').toLowerCase();
    if ((ap === '下午' || ap === 'pm') && h < 12) h += 12; else if ((ap === '上午' || ap === 'am') && h === 12) h = 0;
    return tpeFmt(+m[1], +m[2], +m[3], h, +m[6]);
  }

}
const isPaid = o => o.status !== undefined ? String(o.status).trim() === '已付' : Boolean(o.paid);
const setPaid = (o, v) => { o.paid = v; o.status = v ? '已付' : '未付'; };

const loaderHTML = t => '<div class="sk-wrap" role="status" aria-label="' + t + '">' + '<div class="sk"></div>'.repeat(3) + '</div>';
const retryHTML = (msg, fn) => `<div class="retry-box"><i class="ic i-x" aria-hidden="true" style="display:block;font-size:52px;margin:0 auto 12px"></i>讀取失敗：${escapeHTML(msg)}<br><button class="btn-action retry-btn" onclick="${fn}">重新嘗試</button></div>`;

// ---------- API ----------
let rollReady = false, failStreak = 0, lastOrdersAt = 0, lastInitialAt = 0, initFails = 0;
async function apiRequest(action, data = {}, retries = MAX_RETRIES, silent = false) {
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    return new Promise((resolve, reject) => {
      const to = setTimeout(() => reject(new Error('連線逾時，請檢查網路狀態後重試！')), (action === 'getInitialData' || action === 'getOrdersAndPaymentStatus') ? READ_TIMEOUT_MS : REQUEST_TIMEOUT_MS);
      const r = google.script.run
        .withSuccessHandler(res => {
          if (action === 'getOrdersAndPaymentStatus' && Array.isArray(res)) res = { success: true, orders: res, data: res };
          clearTimeout(to); hideConnBanner(); resolve(res);
        })
        .withFailureHandler(err => { clearTimeout(to); reject(new Error((err && err.message) || String(err))); });
      switch (action) {
        case 'getInitialData': r.getInitialData(); break;
        case 'getOrdersAndPaymentStatus': r.getOrdersAndPaymentStatus(); break;
        case 'submitOrder': r.submitOrder(data.payload ? JSON.parse(data.payload) : data); break;
        case 'adminVerify': r.adminVerify(data.password); break;
        case 'adminTogglePaid': r.adminTogglePaid(data.password, data.rowIndex, data.newStatus); break;
        case 'adminChangeShop': r.adminChangeShop(data.password, data.newShop); break;
        case 'adminClearAllOrders': r.adminClearAllOrders(data.password); break;
        case 'adminSetOrdering': r.adminSetOrdering(data.password, data.open); break;
        default: reject(new Error('未知的動作: ' + action));
      }
    });
  }
  const TMO = (action === 'adminVerify' || action === 'ping') ? FAST_TIMEOUT_MS : (action === 'getInitialData' || action === 'getOrdersAndPaymentStatus') ? READ_TIMEOUT_MS : REQUEST_TIMEOUT_MS;
  let lastErr = null;
  const hasAbort = typeof AbortController !== 'undefined';
  for (let attempt = 0; attempt <= retries; attempt++) {
    const controller = hasAbort ? new AbortController() : null;
    const timeoutId = controller ? setTimeout(() => controller.abort(), TMO) : 0;
    try {
      let text;
      const pre = attempt === 0 && PRE[action];
      if (pre) {
        PRE[action] = null;
        const r = await Promise.race([pre, new Promise((_, rej) => setTimeout(() => rej(Object.assign(new Error('timeout'), { name: 'AbortError' })), TMO))]);
        if (!r.ok) throw new Error(`HTTP 錯誤狀態: ${r.status}`);
        text = r.text.trim();
      } else {
        const response = await fetch(GAS_API_URL, {
          method: 'POST', redirect: 'follow', cache: 'no-store',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action, ...data }), signal: controller ? controller.signal : undefined

        if (!response.ok) throw new Error(`HTTP 錯誤狀態: ${response.status}`);
        text = (await response.text()).trim();
      }
      if (text.startsWith('<')) throw new Error('伺服器忙碌中或權限設定異常，稍後會自動重試。');
      let json;
      try { json = JSON.parse(text); } catch (e) { throw new Error('伺服器回傳格式異常，請稍後再試'); }
      failStreak = 0; hideConnBanner();

    } catch (err) {
      lastErr = err;
      if (attempt === retries) {
        if (!silent || ++failStreak >= 2) showConnBanner();
        throw new Error(err.name === 'AbortError' ? '連線逾時，請檢查網路狀態後重試！' : (err.message || '無法連線至伺服器。'));
      }
      await new Promise(r => setTimeout(r, RETRY_BASE_DELAY_MS * (attempt + 1) + Math.random() * 800));
    } finally { clearTimeout(timeoutId); }
  }
  throw lastErr || new Error('無法連線至伺服器。');
}
function showConnBanner() { $('connBanner').classList.add('show'); }
function hideConnBanner() { $('connBanner').classList.remove('show'); }

// ---------- Modal ----------
function setModalIcon(icon) { $('modalIcon').innerHTML = '<i class="ic i-' + (ICON_MAP[icon] || 'ok') + '"></i>'; }

// ---------- 打烊像素招牌 ----------

// ---------- 初始化 ----------
function init() {
  buildCloseSign();
  const g = store.get('lunchApp_group'), n = store.get('lunchApp_name');
  if (g && groupMembersData[g]) {
    $('groupSelect').value = g; updateNameOptions();

  }
  const co = store.get('lunchApp_orders');

  const cached = store.get('lunchApp_cachedData');
  if (cached) { try {
    const d = JSON.parse(cached), stale = Date.now() - (+store.get('lunchApp_cachedAt') || 0) > 600000;

const BASE_POLL = POLL_MS * (LITE ? 2 : 1);
let pollDelay = BASE_POLL, pollTimer = 0;
function schedulePoll(ms) { clearTimeout(pollTimer); pollTimer = setTimeout(pollOrders, ms || pollDelay * (0.8 + Math.random() * 0.4)); }
async function pollOrders() {
  if (document.hidden || navigator.onLine === false || toggling || (currentTab !== 'status' && currentTab !== 'admin')) return schedulePoll();
  const v = ordersVer;
  try {
    await fetchOrders(0, true); renderOrders(allOrders); renderAdminTable(allOrders);
    pollDelay = ordersVer !== v ? BASE_POLL : Math.min(pollDelay * 1.5, BASE_POLL * 3);
  } catch (e) { pollDelay = Math.min(pollDelay * 2, BASE_POLL * 4); }

}

window.addEventListener('online', () => { failStreak = 0; hideConnBanner(); wakePoll(); });

}

async function loadInitialData() {
  if (isFetchingData) return;
  isFetchingData = true;
  try {
    const res = await apiRequest('getInitialData', {}, undefined, menuItems.length > 0);
    if (!res || !res.success) throw new Error((res && res.message) || '讀取資料失敗');
    lastInitialAt = Date.now(); store.set('lunchApp_cachedAt', String(lastInitialAt));
    const txt = JSON.stringify(res);
    if (txt !== cachedTxt) { cachedTxt = txt; applyDataToUI(res); lazy(() => store.set('lunchApp_cachedData', txt)); }

function rollTotal(n) {

    if (rollReady) void d.offsetWidth;
  }
  d.querySelectorAll('.col').forEach((c, i) => { c.style.transform = 'translateY(-' + s[i] + 'em)'; });
}
function calculateTotal() {
  let total = 0;
  document.querySelectorAll('.item-row').forEach(row => {
    const s = row.querySelector('select'), o = s.options[s.selectedIndex];
    const p = o ? Number(o.dataset.price) || 0 : 0;
    row.querySelector('.price-tag').textContent = '$' + p;
    total += p;
  });
  rollTotal(total);
  return total;
}

// 像素方塊慶祝特效（低階機種自動關閉）
function burst(el) {
  if (LITE || TOUCH || !Element.prototype.animate || (window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches)) return;
  const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, cols = ['#FF6701', '#FEA82F', '#FFBB5C', '#FF9B50', '#E25E3E'];
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('i'), a = Math.random() * Math.PI * 2, v = 90 + Math.random() * 150;
    p.style.cssText = 'position:fixed;left:' + cx + 'px;top:' + cy + 'px;width:8px;height:8px;pointer-events:none;z-index:4000;background:' + cols[i % 5];
    frag.appendChild(p);
    p.animate([
      { transform: 'translate(0,0)', opacity: 1 },
      { transform: 'translate(' + Math.cos(a) * v + 'px,' + (Math.sin(a) * v - 80) + 'px)', opacity: 1, offset: .6 },
      { transform: 'translate(' + Math.cos(a) * v * 1.1 + 'px,' + (Math.sin(a) * v + 120) + 'px)', opacity: 0 }
    ], { duration: 900 + Math.random() * 300, easing: 'steps(10,end)' }).onfinish = () => p.remove();
  }
  document.body.appendChild(frag);
}
async function handleOrderSubmit() {
  saveUserSelection();
  if (!orderingOpen) return showModal('提示', '今日已打烊，來不及囉┐(´д`)┌', '⚠️');
  const group = $('groupSelect').value, name = $('nameSelect').value;
  if (!group || !name) return showModal('提示', '請先選擇組別以及座號姓名！', '⚠️');
  const items = readItems();
  if (items.length === 0) return showModal('提示', '請至少選擇一項餐點！', '⚠️');
  const total = items.reduce((a, i) => a + i.price, 0);

  const btn = $('submitBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>送出中…';
  try {
    // 金額僅供顯示；後端會依菜單重新計算並以後端為準
    const payload = { group, name, items, total, totalAmount: total, note: $('orderNote').value.trim() };
    let res = null;
    for (let tries = 0; ; tries++) {
      res = await apiRequest('submitOrder', { payload: JSON.stringify(payload) }, 0);
      if (!(res && res.code === 'BUSY') || tries >= 3) break;
      btn.innerHTML = '<span class="spinner"></span>人多排隊中…(' + (tries + 1) + '/3)';
      await new Promise(r => setTimeout(r, 1200 + Math.random() * 1800));
    }
    if (res && res.success) {
      burst(btn); showModal('點餐成功！', '記得要繳錢呦(๑•̀ㅂ•́)و✧', '🎆', () => {
        $('orderNote').value = ''; $('itemList').innerHTML = ''; addItemRow();
        lastOrdersAt = 0; switchTab('status');
      });
    } else {
      if (res && res.code === 'MENU_CHANGED') loadInitialData();
      if (res && res.code === 'ORDER_CLOSED') { orderingOpen = false; applyOrderingState(); loadInitialData(); }
      throw new Error((res && res.message) || '送出失敗');
    }
  } catch (err) {
    showModal('送出失敗', (err.message || '送出失敗，請再試一次。') + (/逾時/.test(err.message) ? '\n訂單可能已送出，請先到「對帳與查詢」確認，再決定是否重送。' : ''), '❌');
  } finally {
    btn.disabled = false; btn.innerHTML = '送出點餐';
  }
}

// ---------- 訂單資料 ----------
function fetchOrders(retries, silent) {
  if (ordersPromise) return ordersPromise;
  ordersPromise = (async () => {
    const res = await apiRequest('getOrdersAndPaymentStatus', {}, retries, silent);
    if (!res || !res.success) throw new Error((res && res.message) || '載入失敗');
    lastOrdersAt = Date.now();
    if (!toggling) setOrders(res.orders || res.data || []);
    return allOrders;
  })().finally(() => { ordersPromise = null; });
  return ordersPromise;
}
async function loadStatusData(force = false) {
  const box = $('statusList'), rb = $('btnRefreshStatus');
  if (ordersReady) renderOrders(allOrders);
  else if (!box.querySelector('.sk-wrap')) box.innerHTML = loaderHTML('載入紀錄中…');
  if (!force && ordersReady && Date.now() - lastOrdersAt < FRESH_MS) return;
  rb.classList.add('busy'); const rbText = rb.textContent; if (force) rb.textContent = '更新中…';
  try { await fetchOrders(force ? undefined : 0, !force); renderOrders(allOrders); }
  catch (err) { if (!ordersReady) { box.className = ''; box.innerHTML = retryHTML(err.message, 'loadStatusData(true)'); } }
  finally { rb.classList.remove('busy'); rb.textContent = rbText; }
}
function orderCardHTML(o) {

  return `<div class="order-item ${paid ? 'is-paid' : ''}" data-k="${escapeHTML((o.group + ' ' + o.name + ' ' + orderDetails(o)).toLowerCase())}">
      <div class="order-header"><div class="order-user"><span class="adm-grp">${escapeHTML(o.group)}</span><span class="adm-name">${escapeHTML(o.name)}</span></div>
      <span class="badge ${paid ? 'badge-paid' : 'badge-unpaid'}">${paid ? '已付' : '未付'}</span></div>
      <div class="order-details"><strong>${escapeHTML(orderDetails(o)) || '無'}</strong><br><span class="adm-amt" style="color:var(--text)">$${escapeHTML(o.total)}</span>${t ? ' · ' + escapeHTML(t) : ''}${o.note ? '<br>備註：' + escapeHTML(o.note) : ''}</div>
    </div>`;
}
function renderOrders() {
  if (currentTab !== 'status' || !ordersReady) return;
  const box = $('statusList');
  if (box.dataset.v !== String(ordersVer)) {
    box.dataset.v = ordersVer; box.className = '';

}
function applyStatusFilter() {
  const kw = $('statusFilter').value.trim().toLowerCase(); let shown = 0;
  $('statusList').querySelectorAll('.order-item').forEach(c => { const ok = !kw || c.dataset.k.indexOf(kw) > -1; if (c.hidden === ok) c.hidden = !ok; if (ok) shown++; });
  const e = $('statusEmpty'); if (e) e.hidden = shown > 0;
}
function filterStatus() {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(applyStatusFilter, 120);
}
function renderMenuList() {
  const box = $('menuList');
  box.className = '';
  if (!menuItems.length) { box.innerHTML = '<div class="empty">目前尚無今日菜單</div>'; return; }
  box.innerHTML = '<table class="menu-table">' + menuItems.map(i => `<tr><td>${escapeHTML(i.name)}</td><td>$${Number(i.price) || 0}</td></tr>`).join('') + '</table>';

// ---------- 管理員 ----------
let lastPing = 0;
function openAdminModal() {
  if (adminToken) return switchTab('admin');
  if (Date.now() - lastPing > 60000) { lastPing = Date.now(); apiRequest('ping', {}, 0, true).catch(() => {}); }

}
function closeAdminModal() { $('adminLoginModal').style.display = 'none'; }
async function submitAdminLogin() {
  const pwd = $('adminPasswordInput').value;
  if (!pwd) return;
  const btn = $('adminLoginBtn'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>驗證中…';
  const slow = setTimeout(() => { btn.innerHTML = '<span class="spinner"></span>伺服器喚醒中…'; }, 3500);

async function loadAdminOrders(force = false) {
  const box = $('adminOrdersContainer');
  if (!ordersReady && !box.querySelector('.sk-wrap')) box.innerHTML = loaderHTML('載入訂單中…');
  if (!force && ordersReady && Date.now() - lastOrdersAt < FRESH_MS) return;

function updateAdminStats(orders) {
  let total = 0, paid = 0;
  orders.forEach(o => { const t = Number(o.total) || 0; total += t; if (isPaid(o)) paid += t; });
  $('statOrderCount').innerText = orders.length + ' 筆';
  $('statTotalAmount').innerText = '$' + total;
  $('statPaidAmount').innerText = '$' + paid;
  $('statUnpaidAmount').innerText = '$' + (total - paid);
  const np = orders.filter(o => !isPaid(o)).length;
  $('segAll').textContent = '全部 ' + orders.length; $('segUnpaid').textContent = '未付 ' + np; $('segPaid').textContent = '已付 ' + (orders.length - np);
}

// ---------- 品項統計＋一鍵複製叫餐文字 ----------
let tallyText = '';
function tallyItems(orders) {
  const map = {};
  orders.forEach(o => {
    if (Array.isArray(o.items)) {                       // 後端有回傳 items 時最準確
      o.items.forEach(i => { if (i && i.name) map[i.name] = (map[i.name] || 0) + 1; });
    } else {
      orderDetails(o).split(/[、,，;；\n]+/).forEach(s => {   // 否則解析 details 文字
        const n = s.replace(/\s*[xX×*]\s*\d+\s*$/, '').replace(/\(\$?\d+\)|\$\d+/g, '').trim();
        if (n) map[n] = (map[n] || 0) + 1;
      });
    }
  });
  return Object.entries(map).sort((a, b) => b[1] - a[1]);
}
function renderTally(orders) {
  const rows = tallyItems(orders);
  tallyText = rows.map(r => r[0] + ' ×' + r[1]).join('、');   // 例如：雞腿飯 ×5、紅茶 ×3
  $('itemTotalCount').textContent = rows.length ? '（共 ' + rows.reduce((a, r) => a + r[1], 0) + ' 份）' : '';
  $('btnCopyTally').disabled = !rows.length;
  $('itemTally').innerHTML = rows.length
    ? '<table class="menu-table">' + rows.map(r => `<tr><td>${escapeHTML(r[0])}</td><td>× ${r[1]}</td></tr>`).join('') + '</table>'
    : '<div class="empty">目前沒有訂單</div>';
}
async function copyText(t) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(t); return true; }
  } catch (e) {}
  // 備援：GAS 內嵌 iframe 或舊瀏覽器可能不給 clipboard API
  const ta = document.createElement('textarea');
  ta.value = t; ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  return ok;
}
async function copyTally(btn) {
  if (!tallyText) return;
  const old = btn.textContent;
  const ok = await copyText(tallyText);
  if (ok) { btn.textContent = '已複製 ✔'; setTimeout(() => { btn.textContent = old; }, 1500); }
  else showModal('複製失敗', '請手動抄寫：\n' + tallyText, '⚠️');
}

function adminCardHTML(o) {
  const paid = isPaid(o), ok = Number(o.rowIndex) > 1;
  return `<div class="adm-card ${paid ? 'is-paid' : ''}" data-p="${paid ? 1 : 0}"><div class="adm-main">
      <div class="adm-who"><span class="adm-grp">${escapeHTML(o.group)}</span><span class="adm-name">${escapeHTML(o.name)}</span><span class="adm-amt">$${escapeHTML(o.total)}</span></div>
      <div class="adm-items">${escapeHTML(orderDetails(o)) || '無'}${o.note ? ' ｜ 備註：' + escapeHTML(o.note) : ''}</div></div>
      <button class="badge ${paid ? 'badge-paid' : 'badge-unpaid'}" ${ok ? '' : 'disabled'} onclick="toggleOrderStatus(${Number(o.rowIndex)}, this)" aria-label="${escapeHTML(o.name)} 繳費狀態，點擊切換">${paid ? '✔ 已付' : '○ 未付'}</button></div>`;
}
function renderAdminTable() {
  if (currentTab !== 'admin') return;
  updateAdminStats(allOrders);
  renderTally(allOrders);
  const box = $('adminOrdersContainer');
  if (box.dataset.v !== String(ordersVer)) {
    box.dataset.v = ordersVer;
    box.innerHTML = allOrders.length ? '<div class="adm-list">' + allOrders.map(adminCardHTML).join('') + '</div><div class="empty" id="admEmpty" hidden>這個分類目前沒有訂單</div>' : '<div class="empty">目前沒有任何訂單</div>';
  }
  applyAdminFilter();
}
function applyAdminFilter() {
  let shown = 0;
  $('adminOrdersContainer').querySelectorAll('.adm-card').forEach(c => { const ok = adminFilter === 'all' || (adminFilter === 'paid') === (c.dataset.p === '1'); if (c.hidden === ok) c.hidden = !ok; if (ok) shown++; });
  const e = $('admEmpty'); if (e) e.hidden = shown > 0;
}
function setAdminFilter(f) {
  adminFilter = f;
  document.querySelectorAll('#adminSeg button').forEach(b => b.classList.toggle('on', b.dataset.f === f));
  renderAdminTable(allOrders);
}
// 樂觀更新：先改畫面，失敗再還原
async function toggleOrderStatus(rowIndex, btn) {
  const o = allOrders.find(x => x.rowIndex === rowIndex);
  if (!o || btn.disabled) return;
  const prev = isPaid(o), next = !prev;
  const card = btn.closest('.adm-card');
  const paint = v => { btn.textContent = v ? '✔ 已付' : '○ 未付'; btn.className = 'badge ' + (v ? 'badge-paid' : 'badge-unpaid'); if (card) { card.classList.toggle('is-paid', v); card.dataset.p = v ? '1' : '0'; } $('adminOrdersContainer').dataset.v = String(ordersVer); };
  if (navigator.vibrate) navigator.vibrate(12);
  toggling++; setPaid(o, next); touchOrders(); paint(next); updateAdminStats(allOrders); btn.disabled = true;
  try {
    const res = await apiRequest('adminTogglePaid', { password: adminToken, rowIndex, newStatus: next });
    if (!res || !res.success) throw new Error((res && res.message) || '更新失敗');
  } catch (err) {
    setPaid(o, prev); touchOrders(); paint(prev); updateAdminStats(allOrders);
    showModal('同步失敗', '狀態已還原。\n(' + err.message + ')', '⚠️');
  } finally { btn.disabled = false; toggling--; }
}
function populateAdminShopsSelect() {
  const sel = $('adminShopsSelect');
  sel.innerHTML = allShopsList.map(s => `<option value="${escapeHTML(s)}" ${s === currentShop ? 'selected' : ''}>${escapeHTML(s)}</option>`).join('');
}
function handleAdminChangeShop() {
  const newShop = $('adminShopsSelect').value;
  if (!newShop) return;
  showConfirmModal('確認更換', `確定要將今日店家切換為「${newShop}」嗎？`, '❓', async () => {
    try {
      const res = await apiRequest('adminChangeShop', { password: adminToken, newShop }, 0);

}
function handleAdminToggleOrdering() {
  const open = !orderingOpen;
  showConfirmModal(open ? '開店' : '閉店',
    open ? '確定要重新開放點餐嗎？' : '關閉後同學將無法再送出訂單，確定嗎？', '❓', async () => {
    const btn = $('btnToggleOrdering'), prev = orderingOpen;

    btn.classList.add('busy'); $('orderingState').textContent = '（同步中…）';

      const res = await apiRequest('adminSetOrdering', { password: adminToken, open }, 0);
      if (!res || !res.success) throw new Error((res && res.message) || '操作失敗');
      orderingOpen = res.open !== false; cachedTxt = ''; applyOrderingState();
      try { const c = JSON.parse(store.get('lunchApp_cachedData') || 'null'); if (c) { c.orderingOpen = orderingOpen; store.set('lunchApp_cachedData', JSON.stringify(c)); } } catch (e) {}
      showModal('成功', res.message || (open ? '已開店！' : '已閉店！'), '🎉');
    } catch (err) {
      orderingOpen = prev; applyOrderingState();               // 失敗才還原
      showModal('錯誤', err.message || '操作失敗', '❌');

    finally { btn.classList.remove('busy'); }
  });
}
function handleAdminClearOrders() {
  showConfirmModal('確定要清空嗎？', '按了就回不去囉瑞煩:)', '⚠️', async () => {
    try {
      const res = await apiRequest('adminClearAllOrders', { password: adminToken }, 0);

}
// ---------- 防複製（僅能擋一般使用者，無法真正防止技術人員） ----------
(function () {
  const isField = el => !!el && /^(INPUT|TEXTAREA)$/.test(el.tagName);
  const stop = e => { e.preventDefault(); e.stopPropagation(); return false; };
  document.addEventListener('contextmenu', e => { if (!isField(e.target)) stop(e); }, true);
  document.addEventListener('selectstart', e => { if (!isField(e.target)) stop(e); }, true);
  document.addEventListener('dragstart', stop, true);
  ['copy', 'cut'].forEach(ev => document.addEventListener(ev, e => { if (!isField(e.target)) stop(e); }, true));
  document.addEventListener('keydown', e => {
    const c = e.code, mod = e.ctrlKey || e.metaKey;
    if (c === 'F12') return stop(e);
    if (mod && e.shiftKey && ['KeyI', 'KeyJ', 'KeyC', 'KeyK'].includes(c)) return stop(e);
    if (mod && e.altKey && ['KeyI', 'KeyJ', 'KeyC', 'KeyU'].includes(c)) return stop(e);
    if (mod && ['KeyU', 'KeyS', 'KeyP'].includes(c)) return stop(e);
    if (mod && ['KeyA', 'KeyC', 'KeyX'].includes(c) && !isField(e.target)) return stop(e);
  }, true);
})();
// ---------- 回訪秒開：Service Worker（僅在自有靜態網域啟用；GAS 內嵌網址不適用）----------
if ('serviceWorker' in navigator && location.protocol === 'https:' && !/googleusercontent\.com$|script\.google\.com$/.test(location.hostname)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
