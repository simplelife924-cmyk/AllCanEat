<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今天要吃什麼勒 - 智慧點餐系統</title>
  <style>
    :root {
      --bg-color: #f4f7f7;
      --primary: #1f4e5f;
      --primary-dark: #163a47;
      --secondary: #79a8a9;
      --accent: #aacfd0;
      --accent-light: rgba(170, 207, 208, 0.25);
      --white: #ffffff;
      --text: #2c3e50;
      --danger: #e74c3c;
      --danger-bg: #fdeeee;
      --success: #27ae60;
      --success-bg: #e8f8f0;
      --border: #d2e4e4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      padding-bottom: 60px;
    }

    header {
      background-color: var(--primary);
      color: var(--white);
      padding: 16px 20px;
      text-align: center;
      position: relative;
      box-shadow: 0 2px 8px rgba(31, 78, 95, 0.2);
    }
    header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .shop-badge {
      display: inline-block;
      background-color: var(--secondary);
      color: var(--white);
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .admin-entry-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .admin-entry-btn:hover {
      background: rgba(255, 255, 255, 0.28);
    }

    .tabs {
      display: flex;
      justify-content: center;
      background-color: var(--white);
      border-bottom: 2px solid var(--accent);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .tab-btn {
      flex: 1;
      max-width: 220px;
      padding: 13px 10px;
      border: none;
      background: none;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--secondary);
      cursor: pointer;
      transition: all 0.2s;
      border-bottom: 3px solid transparent;
    }
    .tab-btn.active {
      color: var(--primary);
      border-bottom: 3px solid var(--primary);
      background-color: rgba(170, 207, 208, 0.15);
    }

    .container {
      max-width: 680px;
      margin: 20px auto;
      padding: 0 16px;
    }
    .card {
      background-color: var(--white);
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.04);
      border: 1px solid var(--accent);
      margin-bottom: 20px;
    }
    .card-title {
      font-size: 1.15rem;
      color: var(--primary);
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 6px;
    }
    input[type="text"], input[type="password"], select {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--accent);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: 0.2s;
      background-color: #fff;
    }
    input:focus, select:focus {
      border-color: var(--secondary);
      box-shadow: 0 0 0 3px rgba(121, 168, 169, 0.2);
    }

    .item-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }
    .item-row select {
      flex: 2;
    }
    .item-row .price-tag {
      width: 75px;
      text-align: right;
      font-weight: 700;
      color: var(--primary);
      font-size: 0.95rem;
    }
    .btn-remove {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0 6px;
    }

    .btn-add-item {
      background-color: rgba(170, 207, 208, 0.25);
      border: 1.5px dashed var(--secondary);
      color: var(--primary);
      padding: 10px;
      width: 100%;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      margin-top: 6px;
      transition: 0.2s;
    }
    .btn-add-item:hover {
      background-color: var(--accent);
    }

    .summary-box {
      background-color: rgba(170, 207, 208, 0.2);
      border-left: 4px solid var(--primary);
      padding: 12px 16px;
      border-radius: 6px;
      margin: 18px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .total-price {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--primary);
    }

    .btn-submit {
      background-color: var(--primary);
      color: var(--white);
      border: none;
      padding: 13px;
      width: 100%;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-submit:hover {
      background-color: var(--primary-dark);
    }
    .btn-submit:disabled {
      background-color: #bbb;
      cursor: not-allowed;
    }

    .btn-action {
      background-color: var(--primary);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-danger {
      background-color: var(--danger);
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    .btn-back {
      background: #718096;
      color: white;
      border: none;
      padding: 11px;
      border-radius: 8px;
      width: 100%;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 15px;
    }

    .search-box {
      margin-bottom: 15px;
    }
    .order-item {
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
      background: #fafdfd;
    }
    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .order-user {
      font-weight: 700;
      color: var(--primary);
      font-size: 1rem;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .badge-paid {
      background-color: var(--success-bg);
      color: var(--success);
      border: 1px solid #b7ebd0;
    }
    .badge-unpaid {
      background-color: var(--danger-bg);
      color: var(--danger);
      border: 1px solid #fad2d2;
    }
    .order-details {
      font-size: 0.85rem;
      color: #555;
      line-height: 1.5;
    }

    .admin-badge {
      background-color: #e67e22;
      color: #fff;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 10px;
      margin-left: 6px;
    }
    .admin-stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: #f8fbfb;
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 10px 14px;
      text-align: center;
    }
    .stat-card .stat-num {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary);
      margin-top: 4px;
    }
    .stat-card .stat-label {
      font-size: 0.75rem;
      color: #666;
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    .admin-table th, .admin-table td {
      border: 1px solid #e1ecec;
      padding: 8px 6px;
      text-align: left;
    }
    .admin-table th {
      background-color: #edf5f5;
      color: var(--primary);
      font-weight: 700;
    }
    .status-clickable {
      cursor: pointer;
      display: inline-block;
      padding: 4px 8px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.75rem;
      transition: transform 0.1s;
      user-select: none;
    }
    .status-clickable:hover {
      transform: scale(1.05);
    }

    .loader {
      text-align: center;
      padding: 30px;
      color: var(--secondary);
      font-size: 0.95rem;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(31, 78, 95, 0.45);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      backdrop-filter: blur(2px);
    }
    .modal-card {
      background: #ffffff;
      border-radius: 14px;
      padding: 24px;
      max-width: 320px;
      width: 85%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      border: 1.5px solid var(--accent);
      animation: popIn 0.25s ease-out;
    }
    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-icon {
      font-size: 2.2rem;
      margin-bottom: 10px;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
    }
    .modal-msg {
      font-size: 0.95rem;
      color: #444;
      margin-bottom: 18px;
      line-height: 1.5;
    }
    .modal-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    .modal-btn:hover {
      background: var(--primary-dark);
    }
  </style>
</head>
<body>

  <header>
    <h1>🍱 今天要吃什麼勒</h1>
    <div class="shop-badge" id="currentShopText">載入店家資訊中...</div>
    <button class="admin-entry-btn" onclick="openAdminModal()" title="後台管理">
      <span>🔒</span> 管理員
    </button>
  </header>

  <div class="tabs" id="mainTabs">
    <button class="tab-btn active" onclick="switchTab('order')">我要點餐</button>
    <button class="tab-btn" onclick="switchTab('status')">對帳與查詢</button>
    <button class="tab-btn" onclick="switchTab('menu')">今日菜單</button>
  </div>

  <div class="container">
    
    <div id="tab-order">
      <div class="card">
        <div class="card-title">填寫訂購資訊</div>

        <div class="form-group">
          <label>組別 *</label>
          <select id="orderGroup">
            <option value="">-- 請選擇組別 --</option>
            <option value="第一組">第一組</option>
            <option value="第二組">第二組</option>
            <option value="第三組">第三組</option>
            <option value="第四組">第四組</option>
            <option value="第五組">第五組</option>
            <option value="教師組">教師組</option>
          </select>
        </div>

        <div class="form-group">
          <label>座號與姓名 *</label>
          <input type="text" id="orderName" placeholder="例如：01我是誰" required>
        </div>

        <div class="form-group">
          <label>餐點品項 (最多 5 項)</label>
          <div id="itemList"></div>
          <button type="button" class="btn-add-item" id="btnAddItem" onclick="addItemRow()">+ 新增一項餐點</button>
        </div>

        <div class="form-group">
          <label>備註</label>
          <input type="text" id="orderNote" placeholder="(不一定要填)">
        </div>

        <div class="summary-box">
          <span>應付總金額</span>
          <span class="total-price" id="totalDisplay">$0</span>
        </div>

        <button class="btn-submit" id="submitBtn" onclick="handleOrderSubmit()">確認送出點餐</button>
      </div>
    </div>

    <div id="tab-status" style="display:none;">
      <div class="card">
        <div class="card-title">
          <span>點餐與繳費狀態</span>
          <button class="btn-action" style="padding: 4px 10px; font-size: 0.8rem;" onclick="loadStatusData()">🔄 重新整理</button>
        </div>
        <div class="search-box">
          <input type="text" id="statusFilter" placeholder="搜尋姓名或組別..." oninput="filterStatus()">
        </div>
        <div id="statusList" class="loader">載入紀錄中...</div>
      </div>
    </div>

    <div id="tab-menu" style="display:none;">
      <div class="card">
        <div class="card-title">今日菜單總覽</div>
        <div id="menuList" class="loader">載入菜單中...</div>
      </div>
    </div>

    <div id="tab-admin" style="display:none;">
      <div class="card">
        <div class="card-title">
          <div>⚙️ 管理員後台控制台 <span class="admin-badge">已登入</span></div>
        </div>

        <div class="admin-stats-grid">
          <div class="stat-card">
            <div class="stat-label">今日總訂單數</div>
            <div class="stat-num" id="statOrderCount">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">訂單總金額</div>
            <div class="stat-num" id="statTotalAmount">$0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">已收金額 (已繳)</div>
            <div class="stat-num" style="color:var(--success);" id="statPaidAmount">$0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">未收金額 (未繳)</div>
            <div class="stat-num" style="color:var(--danger);" id="statUnpaidAmount">$0</div>
          </div>
        </div>

        <div style="background:#fafdfd; border:1px solid var(--accent); border-radius:8px; padding:14px; margin-bottom:15px;">
          <label>🔄 切換今日店家（更新試算表「今日設定」）</label>
          <div style="display: flex; gap: 8px; margin-top: 6px;">
            <select id="adminShopsSelect"></select>
            <button class="btn-action" style="white-space: nowrap;" onclick="handleAdminChangeShop()">確認更換</button>
          </div>
        </div>

        <div style="background:#fafdfd; border:1px solid var(--accent); border-radius:8px; padding:14px; margin-bottom:15px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <label style="margin:0;">📋 點餐人員對帳管理 <span style="font-size:0.75rem; color:#888; font-weight:normal;">(點擊狀態標籤可直接切換試算表狀態)</span></label>
            <button class="btn-action" style="padding: 3px 8px; font-size:0.75rem;" onclick="loadAdminOrders()">🔄 重新整理</button>
          </div>
          <div id="adminOrdersContainer" style="overflow-x: auto;">
            <div class="loader">載入訂單中...</div>
          </div>
        </div>

        <div style="background:#fff8f8; border:1px solid #fad2d2; border-radius:8px; padding:14px; margin-bottom:15px;">
          <label style="color:var(--danger);">🗑️ 清空今日所有點餐紀錄</label>
          <p style="font-size: 0.8rem; color: #777; margin-bottom: 8px;">
            將會清除「今日誰點餐」中的所有訂購資料，並保留標題列。
          </p>
          <button class="btn-danger" onclick="handleAdminClearOrders()">清空今日所有紀錄</button>
        </div>

        <button class="btn-back" onclick="exitAdmin()">↩ 返回點餐頁面</button>
      </div>
    </div>

  </div>

  <div class="modal-overlay" id="customModal">
    <div class="modal-card">
      <div class="modal-icon" id="modalIcon">🎉</div>
      <div class="modal-title" id="modalTitle">提示</div>
      <div class="modal-msg" id="modalMsg">訊息內容</div>
      <button class="modal-btn" onclick="closeModal()">好的，我知道了！</button>
    </div>
  </div>

  <div class="modal-overlay" id="adminLoginModal">
    <div class="modal-card">
      <div class="modal-icon">🔐</div>
      <div class="modal-title">管理員身份驗證</div>
      <div class="form-group" style="margin-top: 12px; text-align: left;">
        <label>請輸入管理密碼：</label>
        <input type="password" id="adminPasswordInput" placeholder="輸入後台密碼">
      </div>
      <div style="display: flex; gap: 8px; justify-content: center; margin-top: 10px;">
        <button class="modal-btn" style="background:#95a5a6; padding: 8px 16px;" onclick="closeAdminModal()">取消</button>
        <button class="modal-btn" style="padding: 8px 16px;" onclick="submitAdminLogin()">登入後台</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycby62Gqr10uIr_dLCbFDSA79jw4f4fkFlhGBRiXo-IEh3Ikx5RkFJzHEayKFdxUZgHmlDA/exec";

    let currentShop = '';
    let menuItems = [];
    let allOrders = [];
    let allShopsList = [];
    let adminToken = '';
    let modalCallback = null;

    // 通用 JSONP 請求處理器 (無 CORS 阻擋問題)
    function jsonpRequest(params) {
      return new Promise((resolve, reject) => {
        const callbackName = 'jsonp_cb_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
        
        window[callbackName] = function(data) {
          delete window[callbackName];
          if (script && script.parentNode) script.parentNode.removeChild(script);
          resolve(data);
        };

        const queryArray = [`callback=${callbackName}`];
        for (const key in params) {
          if (params.hasOwnProperty(key)) {
            queryArray.push(`${encodeURIComponent(key)}=${encodeURIComponent(params[key])}`);
          }
        }

        const script = document.createElement('script');
        script.src = `${GAS_API_URL}?${queryArray.join('&')}`;
        script.onerror = function() {
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
          reject(new Error('網路連線失敗或後端未回應'));
        };

        document.body.appendChild(script);
      });
    }

    function showModal(title, msg, icon = '🎉', callback = null) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalMsg').innerText = msg;
      document.getElementById('modalIcon').innerText = icon;
      modalCallback = callback;
      document.getElementById('customModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('customModal').style.display = 'none';
      if (modalCallback) {
        modalCallback();
        modalCallback = null;
      }
    }

    window.onload = function() {
      loadInitialData();
    };

    async function loadInitialData() {
      try {
        const data = await jsonpRequest({ action: 'getTodayMenuData' });
        if (data.success) {
          currentShop = data.shop || '尚未設定店家';
          menuItems = data.items || [];
          allShopsList = data.allShops || [];

          document.getElementById('currentShopText').innerText = '今日店家：' + currentShop;
          renderMenuList();

          document.getElementById('itemList').innerHTML = '';
          addItemRow();

          populateAdminShopsSelect();
        } else {
          showModal('載入失敗', data.message || '無法取得菜單資料', '⚠️');
        }
      } catch (err) {
        showModal('載入失敗', '資料載入失敗：' + err.message, '⚠️');
      }
    }

    function switchTab(tabId) {
      document.getElementById('tab-order').style.display = 'none';
      document.getElementById('tab-status').style.display = 'none';
      document.getElementById('tab-menu').style.display = 'none';
      document.getElementById('tab-admin').style.display = 'none';
      document.getElementById('mainTabs').style.display = 'flex';

      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

      if (tabId === 'order') {
        document.getElementById('tab-order').style.display = 'block';
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
      } else if (tabId === 'status') {
        document.getElementById('tab-status').style.display = 'block';
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        loadStatusData();
      } else if (tabId === 'menu') {
        document.getElementById('tab-menu').style.display = 'block';
        document.querySelectorAll('.tab-btn')[2].classList.add('active');
      }
    }

    function addItemRow() {
      const container = document.getElementById('itemList');
      const rows = container.querySelectorAll('.item-row');
      if (rows.length >= 5) {
        showModal('提醒', '最多只能點選 5 項餐點！', 'ℹ️');
        return;
      }

      const row = document.createElement('div');
      row.className = 'item-row';

      let options = '<option value="" data-price="0">-- 請選擇餐點品項 --</option>';
      menuItems.forEach(item => {
        options += `<option value="${item.name}" data-price="${item.price}">${item.name} ($${item.price})</option>`;
      });

      row.innerHTML = `
        <select onchange="calculateTotal()">${options}</select>
        <span class="price-tag">$0</span>
        <button type="button" class="btn-remove" onclick="removeItemRow(this)">✕</button>
      `;
      container.appendChild(row);

      if (container.querySelectorAll('.item-row').length >= 5) {
        document.getElementById('btnAddItem').style.display = 'none';
      }
    }

    function removeItemRow(btn) {
      btn.parentElement.remove();
      document.getElementById('btnAddItem').style.display = 'block';
      calculateTotal();
    }

    function calculateTotal() {
      let total = 0;
      const rows = document.querySelectorAll('.item-row');
      rows.forEach(r => {
        const select = r.querySelector('select');
        const price = Number(select.options[select.selectedIndex]?.getAttribute('data-price')) || 0;
        r.querySelector('.price-tag').innerText = '$' + price;
        total += price;
      });
      document.getElementById('totalDisplay').innerText = '$' + total;
      return total;
    }

    async function handleOrderSubmit() {
      const group = document.getElementById('orderGroup').value;
      if (!group) {
        showModal('請確認', '請選擇組別！', '⚠️');
        return;
      }

      const name = document.getElementById('orderName').value.trim();
      if (!name) {
        showModal('請確認', '請填寫座號與姓名！', '⚠️');
        return;
      }

      const selectedItems = [];
      document.querySelectorAll('.item-row select').forEach(s => {
        if (s.value) selectedItems.push(s.value);
      });

      if (selectedItems.length === 0) {
        showModal('請確認', '請至少選擇一項餐點！', '⚠️');
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = '送出處理中...';

      const payload = {
        shop: currentShop,
        group: group,
        name: name,
        note: document.getElementById('orderNote').value.trim(),
        totalAmount: calculateTotal(),
        items: selectedItems
      };

      try {
        const res = await jsonpRequest({ action: 'submitOrder', payload: JSON.stringify(payload) });
        btn.disabled = false;
        btn.innerText = '確認送出點餐';
        if (res.success) {
          showModal('點餐成功！', '記得要繳錢呦(๑•̀ㅂ•́)و✧', '🎉', function() {
            document.getElementById('orderGroup').value = '';
            document.getElementById('orderName').value = '';
            document.getElementById('orderNote').value = '';
            document.getElementById('itemList').innerHTML = '';
            addItemRow();
            calculateTotal();
            switchTab('status');
          });
        } else {
          showModal('送出失敗', res.message, '❌');
        }
      } catch (err) {
        btn.disabled = false;
        btn.innerText = '確認送出點餐';
        showModal('系統錯誤', err.message, '❌');
      }
    }

    async function loadStatusData() {
      const listDiv = document.getElementById('statusList');
      listDiv.innerHTML = '載入中...';
      try {
        const res = await jsonpRequest({ action: 'getOrdersAndPaymentStatus' });
        if (res.success) {
          allOrders = res.data || [];
          renderOrders(allOrders);
        } else {
          listDiv.innerHTML = '<div style="text-align:center; color:red;">載入失敗：' + res.message + '</div>';
        }
      } catch (err) {
        listDiv.innerHTML = '<div style="text-align:center; color:red;">載入失敗：' + err.message + '</div>';
      }
    }

    function renderOrders(orders) {
      const listDiv = document.getElementById('statusList');
      if (orders.length === 0) {
        listDiv.innerHTML = '<div style="text-align:center; color:#888; padding:20px;">目前尚無點餐紀錄</div>';
        return;
      }

      let html = '';
      orders.forEach(o => {
        const badge = o.paid
          ? '<span class="badge badge-paid">✔ 已繳費</span>'
          : '<span class="badge badge-unpaid">✖ 未繳費</span>';

        html += `
          <div class="order-item">
            <div class="order-header">
              <span class="order-user">${o.group ? '[' + o.group + '] ' : ''}${o.name}</span>
              ${badge}
            </div>
            <div class="order-details">
              <strong>金額：</strong>$${o.total} | <strong>時間：</strong>${o.time || '今日'}<br>
              <strong>品項：</strong>${o.itemsSummary || '無'}<br>
              ${o.note ? '<strong>備註：</strong>' + o.note : ''}
            </div>
          </div>
        `;
      });
      listDiv.innerHTML = html;
    }

    function filterStatus() {
      const kw = document.getElementById('statusFilter').value.toLowerCase();
      const filtered = allOrders.filter(o =>
        (o.name && o.name.toLowerCase().includes(kw)) ||
        (o.group && o.group.toString().toLowerCase().includes(kw))
      );
      renderOrders(filtered);
    }

    function renderMenuList() {
      const menuDiv = document.getElementById('menuList');
      if (menuItems.length === 0) {
        menuDiv.innerHTML = '<div style="text-align:center; color:#888; padding:20px;">查無今日店家的菜單資料</div>';
        return;
      }
      let html = '<table style="width:100%; border-collapse: collapse; font-size:0.9rem;">';
      html += '<tr style="background:#f4f7f7; color:#1f4e5f; text-align:left;"><th style="padding:10px;">品項名稱</th><th style="padding:10px; text-align:right;">單價</th></tr>';
      menuItems.forEach(item => {
        html += `<tr style="border-bottom: 1px solid #eee;">
          <td style="padding:10px;">${item.name}</td>
          <td style="padding:10px; text-align:right; font-weight:bold; color:#1f4e5f;">$${item.price}</td>
        </tr>`;
      });
      html += '</table>';
      menuDiv.innerHTML = html;
    }

    function openAdminModal() {
      document.getElementById('adminPasswordInput').value = '';
      document.getElementById('adminLoginModal').style.display = 'flex';
      setTimeout(() => document.getElementById('adminPasswordInput').focus(), 100);
    }

    function closeAdminModal() {
      document.getElementById('adminLoginModal').style.display = 'none';
    }

    function submitAdminLogin() {
      const pwd = document.getElementById('adminPasswordInput').value;
      if (!pwd) {
        alert('請輸入管理員密碼');
        return;
      }
      adminToken = pwd;
      closeAdminModal();
      enterAdminPanel();
    }

    function enterAdminPanel() {
      document.getElementById('tab-order').style.display = 'none';
      document.getElementById('tab-status').style.display = 'none';
      document.getElementById('tab-menu').style.display = 'none';
      document.getElementById('mainTabs').style.display = 'none';

      document.getElementById('tab-admin').style.display = 'block';
      window.scrollTo(0, 0);

      populateAdminShopsSelect();
      loadAdminOrders();
    }

    function exitAdmin() {
      document.getElementById('tab-admin').style.display = 'none';
      switchTab('order');
    }

    function populateAdminShopsSelect() {
      const select = document.getElementById('adminShopsSelect');
      if (!select) return;
      select.innerHTML = '';
      allShopsList.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s;
        opt.innerText = s;
        if (s === currentShop) opt.selected = true;
        select.appendChild(opt);
      });
    }

    async function handleAdminChangeShop() {
      const newShop = document.getElementById('adminShopsSelect').value;
      if (!newShop) return;
      if (!confirm(`確定要將今日店家切換為【${newShop}】嗎？`)) return;

      try {
        const res = await jsonpRequest({ action: 'adminChangeShop', password: adminToken, newShop: newShop });
        showModal(res.success ? '成功' : '失敗', res.message, res.success ? '✅' : '❌', function() {
          if (res.success) {
            loadInitialData();
          }
        });
      } catch (err) {
        alert('操作失敗：' + err.message);
      }
    }

    async function loadAdminOrders() {
      const container = document.getElementById('adminOrdersContainer');
      container.innerHTML = '<div class="loader">讀取中...</div>';

      try {
        const res = await jsonpRequest({ action: 'getOrdersAndPaymentStatus' });
        if (res.success) {
          allOrders = res.data || [];
          updateAdminStatistics(allOrders);

          if (allOrders.length === 0) {
            container.innerHTML = '<div style="padding:15px; color:#888; text-align:center;">目前尚無任何點餐紀錄。</div>';
            return;
          }

          let html = `
            <table class="admin-table">
              <thead>
                <tr>
                  <th>組別</th>
                  <th>姓名</th>
                  <th>總額</th>
                  <th>點餐品項與備註</th>
                  <th>繳費狀態 (點擊切換)</th>
                </tr>
              </thead>
              <tbody>
          `;

          allOrders.forEach(r => {
            const statusBadge = r.paid
              ? `<span class="badge badge-paid status-clickable" onclick="togglePaymentStatus(${r.rowIndex}, false)" title="點擊切換為未繳">✅ 已繳</span>`
              : `<span class="badge badge-unpaid status-clickable" onclick="togglePaymentStatus(${r.rowIndex}, true)" title="點擊切換為已繳">❌ 未繳</span>`;

            html += `
              <tr>
                <td>${r.group || '-'}</td>
                <td><strong>${r.name}</strong></td>
                <td style="font-weight:bold; color:var(--primary);">$${r.total}</td>
                <td>
                  ${r.itemsSummary || ''}
                  ${r.note ? '<br><small style="color:#777;">備註：' + r.note + '</small>' : ''}
                </td>
                <td style="text-align:center;">${statusBadge}</td>
              </tr>
            `;
          });

          html += '</tbody></table>';
          container.innerHTML = html;
        } else {
          container.innerHTML = '<div style="padding:15px; color:red; text-align:center;">讀取失敗：' + res.message + '</div>';
        }
      } catch (err) {
        container.innerHTML = '<div style="padding:15px; color:red; text-align:center;">讀取失敗：' + err.message + '</div>';
      }
    }

    function updateAdminStatistics(orders) {
      let count = orders.length;
      let total = 0;
      let paid = 0;

      orders.forEach(o => {
        const amt = Number(o.total) || 0;
        total += amt;
        if (o.paid) paid += amt;
      });

      document.getElementById('statOrderCount').innerText = count + ' 筆';
      document.getElementById('statTotalAmount').innerText = '$' + total;
      document.getElementById('statPaidAmount').innerText = '$' + paid;
      document.getElementById('statUnpaidAmount').innerText = '$' + (total - paid);
    }

    async function togglePaymentStatus(rowIndex, newStatus) {
      try {
        const res = await jsonpRequest({ action: 'adminTogglePaid', password: adminToken, rowIndex: rowIndex, newStatus: newStatus });
        if (res.success) {
          loadAdminOrders();
        } else {
          alert('切換失敗：' + res.message);
        }
      } catch (err) {
        alert('切換失敗：' + err.message);
      }
    }

    async function handleAdminClearOrders() {
      if (!confirm('⚠️ 警告：確定要清空今日所有點餐紀錄嗎？\n此動作會清除試算表中的所有訂單資料，無法復原！')) {
        return;
      }

      try {
        const res = await jsonpRequest({ action: 'adminClearAllOrders', password: adminToken });
        showModal(res.success ? '清空完成' : '清空失敗', res.message, res.success ? '🗑️' : '❌', function() {
          if (res.success) {
            loadAdminOrders();
          }
        });
      } catch (err) {
        alert('清空失敗：' + err.message);
      }
    }
  </script>
</body>
</html>
