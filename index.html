<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>線上點餐與付款管理系統</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-12">

  <!-- 頂部導覽列 -->
  <header class="bg-indigo-600 text-white shadow-md">
    <div class="max-w-4xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center">
      <h1 class="text-xl font-bold tracking-wide">點餐系統</h1>
      <span id="displayTodayShop" class="bg-indigo-800 text-indigo-100 text-sm px-3 py-1 rounded-full font-medium">
        載入店家資料中...
      </span>
    </div>
  </header>

  <!-- 主要內容區塊 -->
  <main class="max-w-4xl mx-auto px-4 mt-6">

    <!-- 分頁切換按鈕 -->
    <div class="flex border-b border-slate-300 mb-6 bg-white rounded-t-lg overflow-hidden shadow-sm">
      <button id="tabOrderBtn" onclick="switchTab('order')" class="flex-1 py-3 px-4 font-semibold text-indigo-600 border-b-2 border-indigo-600 bg-indigo-50/50 transition">
        我要點餐
      </button>
      <button id="tabListBtn" onclick="switchTab('list')" class="flex-1 py-3 px-4 font-semibold text-slate-500 border-b-2 border-transparent hover:text-indigo-600 transition">
        點餐與繳費清單
      </button>
      <button id="tabAdminBtn" onclick="switchTab('admin')" class="flex-1 py-3 px-4 font-semibold text-slate-500 border-b-2 border-transparent hover:text-indigo-600 transition">
        後台管理
      </button>
    </div>

    <!-- 1. 我要點餐區塊 -->
    <section id="sectionOrder" class="bg-white p-6 rounded-lg shadow-sm space-y-6">
      <h2 class="text-lg font-bold border-b pb-2 text-slate-700">選擇餐點</h2>
      
      <form id="orderForm" onsubmit="handleOrderSubmit(event)" class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1">組別 / 第幾組</label>
            <input type="text" id="orderGroup" placeholder="例如：第 1 組" required class="w-full border rounded-md px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">座號 / 姓名</label>
            <input type="text" id="orderName" placeholder="例如：05 張小明" required class="w-full border rounded-md px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium mb-2">菜單品項（最多勾選 5 項）</label>
          <div id="menuItemsContainer" class="space-y-2 border rounded-md p-4 bg-slate-50 min-h-[100px]">
            <p class="text-slate-400 text-sm">正在取得菜單...</p>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">備註（辣度、去冰等）</label>
          <input type="text" id="orderNote" placeholder="例如：微辣、不加蔥" class="w-full border rounded-md px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <div class="flex justify-between items-center pt-4 border-t">
          <div class="text-lg font-bold">
            總金額：<span id="orderTotalAmount" class="text-indigo-600 text-xl">0</span> 元
          </div>
          <button type="submit" id="submitOrderBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2 rounded-md transition shadow">
            送出訂單
          </button>
        </div>
      </form>
    </section>

    <!-- 2. 點餐與繳費清單區塊 -->
    <section id="sectionList" class="hidden bg-white p-6 rounded-lg shadow-sm space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h2 class="text-lg font-bold text-slate-700">今日訂單狀況</h2>
        <button onclick="loadOrdersList()" class="text-sm bg-slate-100 hover:bg-slate-200 px-3 py-1 rounded text-slate-600 transition">
          重新整理
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50 border-b text-sm text-slate-600">
              <th class="p-3">狀態</th>
              <th class="p-3">組別</th>
              <th class="p-3">姓名</th>
              <th class="p-3">品項彙整</th>
              <th class="p-3">金額</th>
              <th class="p-3">時間</th>
              <th class="p-3">備註</th>
            </tr>
          </thead>
          <tbody id="ordersTableBody" class="text-sm divide-y">
            <tr>
              <td colspan="7" class="p-4 text-center text-slate-400">尚無資料</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- 3. 後台管理區塊 -->
    <section id="sectionAdmin" class="hidden bg-white p-6 rounded-lg shadow-sm space-y-6">
      <h2 class="text-lg font-bold border-b pb-2 text-slate-700">管理員控制台</h2>

      <div>
        <label class="block text-sm font-medium mb-1">管理員密碼</label>
        <input type="password" id="adminPassword" placeholder="請輸入管理密碼" class="w-full sm:w-64 border rounded-md px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>

      <!-- 切換店家 -->
      <div class="border p-4 rounded-md space-y-3 bg-slate-50">
        <h3 class="font-semibold text-slate-700">切換今日店家</h3>
        <div class="flex flex-wrap gap-2">
          <select id="adminShopSelect" class="border rounded-md px-3 py-2 outline-none flex-1 min-w-[200px]">
            <option value="">載入店家清單中...</option>
          </select>
          <button onclick="handleAdminChangeShop()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-md transition text-sm">
            套用新店家
          </button>
        </div>
      </div>

      <!-- 管理訂單狀態與清空 -->
      <div class="border p-4 rounded-md space-y-3 bg-slate-50">
        <h3 class="font-semibold text-slate-700">快速修改付款狀態 / 清空資料</h3>
        <p class="text-xs text-slate-500">點擊載入最新訂單後，可直接於下方按鈕調整繳費紀錄，或一鍵清空今日資料。</p>
        
        <div class="flex gap-2">
          <button onclick="loadAdminOrdersList()" class="bg-slate-600 hover:bg-slate-700 text-white px-4 py-2 rounded-md transition text-sm">
            載入管理清單
          </button>
          <button onclick="handleAdminClearAll()" class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-md transition text-sm">
            清空今日所有訂單
          </button>
        </div>

        <div class="overflow-x-auto mt-4">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-slate-200 text-xs text-slate-700">
                <th class="p-2">Row</th>
                <th class="p-2">姓名</th>
                <th class="p-2">金額</th>
                <th class="p-2">目前狀態</th>
                <th class="p-2">操作</th>
              </tr>
            </thead>
            <tbody id="adminOrdersTableBody" class="text-sm divide-y bg-white">
              <tr>
                <td colspan="5" class="p-3 text-center text-slate-400">尚未載入資料</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

  </main>

  <!-- 全域 JS 邏輯 -->
  <script>
    // ==========================================
    // 設定區塊：請替換為您部署後的 GAS Web App URL
    // ==========================================
    const GAS_API_URL = "https://script.google.com/macros/s/YOUR_EXEC_ID/exec";

    // 全域變數
    let currentShopName = "";
    let currentMenuItems = [];

    // 初始化頁面
    document.addEventListener("DOMContentLoaded", () => {
      fetchTodayMenuData();
    });

    /**
     * 統一 API 呼叫器 (使用 POST 發送 JSON 字串，以文字格式避開 CORS 預檢限制)
     */
    async function apiPost(action, payload = {}) {
      const requestData = { action, payload };
      try {
        const response = await fetch(GAS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(requestData)
        });
        return await response.json();
      } catch (err) {
        console.error("API 請求錯誤:", err);
        return { success: false, message: "網路通訊異常或 API URL 設定錯誤。" };
      }
    }

    /**
     * 分頁切換
     */
    function switchTab(tabName) {
      const tabs = ["order", "list", "admin"];
      tabs.forEach(tab => {
        const section = document.getElementById(`section${capitalize(tab)}`);
        const btn = document.getElementById(`tab${capitalize(tab)}Btn`);
        if (tab === tabName) {
          section.classList.remove("hidden");
          btn.classList.add("text-indigo-600", "border-b-2", "border-indigo-600", "bg-indigo-50/50");
          btn.classList.remove("text-slate-500", "border-transparent");
        } else {
          section.classList.add("hidden");
          btn.classList.remove("text-indigo-600", "border-b-2", "border-indigo-600", "bg-indigo-50/50");
          btn.classList.add("text-slate-500", "border-transparent");
        }
      });

      if (tabName === "list") loadOrdersList();
      if (tabName === "admin") loadAdminOrdersList();
    }

    function capitalize(str) {
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    /**
     * 1. 取得今日菜單與店家資料
     */
    async function fetchTodayMenuData() {
      const res = await apiPost("getTodayMenuData");
      if (res.success) {
        currentShopName = res.shop || "未設定";
        currentMenuItems = res.items || [];

        document.getElementById("displayTodayShop").innerText = `今日店家：${currentShopName}`;
        renderMenuOptions(currentMenuItems);
        renderAdminShopDropdown(res.allShops || []);
      } else {
        alert("讀取菜單失敗：" + res.message);
      }
    }

    /**
     * 渲染點餐菜單核取方塊
     */
    function renderMenuOptions(items) {
      const container = document.getElementById("menuItemsContainer");
      if (!items || items.length === 0) {
        container.innerHTML = `<p class="text-slate-400 text-sm">今日【${currentShopName}】無提供菜單品項。</p>`;
        return;
      }

      container.innerHTML = items.map((item, index) => `
        <label class="flex items-center justify-between p-2 hover:bg-white rounded border border-transparent hover:border-slate-200 cursor-pointer transition">
          <div class="flex items-center space-x-2">
            <input type="checkbox" name="menuItem" value="${item.name}" data-price="${item.price}" onchange="handleItemSelect(event)" class="w-4 h-4 text-indigo-600 rounded">
            <span class="text-sm font-medium text-slate-800">${item.name}</span>
          </div>
          <span class="text-sm font-semibold text-slate-600">$${item.price}</span>
        </label>
      `).join("");
    }

    /**
     * 處理選擇品項與計算總金額
     */
    function handleItemSelect(e) {
      const checkboxes = document.querySelectorAll('input[name="menuItem"]:checked');
      if (checkboxes.length > 5) {
        alert("最多只能選擇 5 項品項！");
        if (e && e.target) e.target.checked = false;
        return;
      }

      let total = 0;
      checkboxes.forEach(cb => {
        total += Number(cb.getAttribute("data-price")) || 0;
      });

      document.getElementById("orderTotalAmount").innerText = total;
    }

    /**
     * 送出點餐資料
     */
    async function handleOrderSubmit(e) {
      e.preventDefault();
      const submitBtn = document.getElementById("submitOrderBtn");
      
      const group = document.getElementById("orderGroup").value.trim();
      const name = document.getElementById("orderName").value.trim();
      const note = document.getElementById("orderNote").value.trim();
      const selectedBoxes = document.querySelectorAll('input[name="menuItem"]:checked');

      if (selectedBoxes.length === 0) {
        alert("請至少選擇一項餐點！");
        return;
      }

      const selectedItems = Array.from(selectedBoxes).map(cb => cb.value);
      const totalAmount = Number(document.getElementById("orderTotalAmount").innerText) || 0;

      const payload = {
        group: group,
        name: name,
        shop: currentShopName,
        items: selectedItems,
        totalAmount: totalAmount,
        note: note
      };

      submitBtn.disabled = true;
      submitBtn.innerText = "提交中...";

      const res = await apiPost("submitOrder", payload);
      
      submitBtn.disabled = false;
      submitBtn.innerText = "送出訂單";

      if (res.success) {
        alert("點餐成功！");
        document.getElementById("orderForm").reset();
        document.getElementById("orderTotalAmount").innerText = "0";
        switchTab("list");
      } else {
        alert("點餐失敗：" + res.message);
      }
    }

    /**
     * 2. 載入點餐與繳費狀態清單
     */
    async function loadOrdersList() {
      const tbody = document.getElementById("ordersTableBody");
      tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-slate-400">載入中...</td></tr>`;

      const res = await apiPost("getOrdersAndPaymentStatus");
      if (res.success && Array.isArray(res.data)) {
        if (res.data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-slate-400">今日尚無點餐資料</td></tr>`;
          return;
        }

        tbody.innerHTML = res.data.map(row => `
          <tr class="hover:bg-slate-50">
            <td class="p-3">
              ${row.paid 
                ? `<span class="bg-emerald-100 text-emerald-800 text-xs px-2 py-1 rounded-full font-medium">已繳費</span>` 
                : `<span class="bg-rose-100 text-rose-800 text-xs px-2 py-1 rounded-full font-medium">未繳費</span>`}
            </td>
            <td class="p-3 text-slate-600">${row.group}</td>
            <td class="p-3 font-medium text-slate-800">${row.name}</td>
            <td class="p-3 text-slate-700">${row.itemsSummary}</td>
            <td class="p-3 font-semibold text-slate-900">$${row.total}</td>
            <td class="p-3 text-slate-500 text-xs">${row.time}</td>
            <td class="p-3 text-slate-500 text-xs">${row.note || "-"}</td>
          </tr>
        `).join("");
      } else {
        tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-rose-500">載入資料失敗</td></tr>`;
      }
    }

    /**
     * 3. 後台管理相關邏輯
     */
    function renderAdminShopDropdown(shops) {
      const select = document.getElementById("adminShopSelect");
      if (shops.length === 0) {
        select.innerHTML = `<option value="">無可用店家</option>`;
        return;
      }

      select.innerHTML = shops.map(shop => `
        <option value="${shop}" ${shop === currentShopName ? 'selected' : ''}>${shop}</option>
      `).join("");
    }

    async function handleAdminChangeShop() {
      const password = document.getElementById("adminPassword").value.trim();
      const newShop = document.getElementById("adminShopSelect").value;

      if (!password) {
        alert("請輸入管理員密碼！");
        return;
      }

      const res = await apiPost("adminChangeShop", { password, newShop });
      if (res.success) {
        alert(res.message || "變更成功！");
        fetchTodayMenuData();
      } else {
        alert("操作失敗：" + res.message);
      }
    }

    async function loadAdminOrdersList() {
      const tbody = document.getElementById("adminOrdersTableBody");
      tbody.innerHTML = `<tr><td colspan="5" class="p-3 text-center text-slate-400">載入中...</td></tr>`;

      const res = await apiPost("getOrdersAndPaymentStatus");
      if (res.success && Array.isArray(res.data)) {
        if (res.data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" class="p-3 text-center text-slate-400">無點餐紀錄</td></tr>`;
          return;
        }

        tbody.innerHTML = res.data.map(row => `
          <tr class="hover:bg-slate-50 border-b">
            <td class="p-2 text-slate-400 text-xs">${row.rowIndex}</td>
            <td class="p-2 font-medium">${row.name}</td>
            <td class="p-2">$${row.total}</td>
            <td class="p-2">${row.paid ? '<span class="text-emerald-600 font-bold">已繳</span>' : '<span class="text-rose-500 font-bold">未繳</span>'}</td>
            <td class="p-2">
              <button onclick="handleTogglePaid(${row.rowIndex}, ${!row.paid})" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-2 py-1 rounded border border-indigo-200">
                切換為 ${row.paid ? '未繳' : '已繳'}
              </button>
            </td>
          </tr>
        `).join("");
      } else {
        tbody.innerHTML = `<tr><td colspan="5" class="p-3 text-center text-rose-500">載入失敗</td></tr>`;
      }
    }

    async function handleTogglePaid(rowIndex, newStatus) {
      const password = document.getElementById("adminPassword").value.trim();
      if (!password) {
        alert("請輸入管理員密碼！");
        return;
      }

      const res = await apiPost("adminTogglePaid", { password, rowIndex, newStatus });
      if (res.success) {
        loadAdminOrdersList();
      } else {
        alert("修改失敗：" + res.message);
      }
    }

    async function handleAdminClearAll() {
      const password = document.getElementById("adminPassword").value.trim();
      if (!password) {
        alert("請輸入管理員密碼！");
        return;
      }

      if (!confirm("確定要清空今日所有點餐資料嗎？此操作無法復原！")) {
        return;
      }

      const res = await apiPost("adminClearAllOrders", { password });
      if (res.success) {
        alert(res.message || "已清空資料！");
        loadAdminOrdersList();
      } else {
        alert("清空失敗：" + res.message);
      }
    }
  </script>
</body>
</html>
